<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<style>
:root {color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#050709;color:#faf9f5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
.page{height:100dvh;display:flex;flex-direction:column;position:relative;background:radial-gradient(ellipse at 50% 33%,#20180e 0%,#080b0e 40%,#050709 80%)}
.header{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;padding:16px 19px;background:transparent;z-index:3;direction:rtl}
.header button{width:43px;height:43px;border-radius:50%;background:#1a1e22;color:#fff;border:1px solid #34383b;display:grid;place-items:center}
.header .callKind{font-size:14px;color:#e6b94e;direction:rtl}
.stage{flex:1;min-height:0;display:flex;align-items:center;flex-direction:column;justify-content:center;position:relative;overflow:hidden;padding:8px 16px}
#remoteVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#080b0d;display:none}
#remoteCanvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#050709;display:none;z-index:2}
#localPip{position:absolute;top:70px;right:12px;width:114px;height:152px;border:2px solid #dfb557;border-radius:16px;z-index:5;overflow:hidden;background:#101419;box-shadow:0 7px 22px #000a;display:none;isolation:isolate}
#localVideo{display:block;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#101419}
#localCameraPlaceholder{position:absolute;inset:0;display:grid;place-items:center;padding:9px;text-align:center;direction:rtl;color:#e9c774;font-size:12px;background:#161b20e8;pointer-events:none}
#localCameraLabel{position:absolute;bottom:6px;right:6px;z-index:1;color:#fff;background:#050709aa;border-radius:6px;padding:3px 8px;font-size:11px}
#bigAvatar{width:min(47vw,180px);height:min(47vw,180px);min-width:125px;min-height:125px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(140deg,#6d5126,#15100c);border:3px solid #e6b94e;box-shadow:0 0 0 12px rgba(230,185,78,.035),0 0 42px rgba(230,185,78,.14);margin-bottom:26px}
#bigInitial{font-size:70px;color:#fff;font-weight:600;line-height:1}
#bigAvatarImg{width:100%;height:100%;object-fit:cover;display:none}
#peer{font-weight:750;font-size:clamp(25px,7vw,34px);line-height:1.3;max-width:96%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;color:#fff}
#hint{font-size:17px;color:#c5c9cc;text-align:center;line-height:1.6;margin-top:10px;max-width:94%;overflow-wrap:anywhere}
#duration{font-size:15px;color:#d8b766;letter-spacing:1px;min-height:22px;margin-top:9px;direction:ltr}
.actions{z-index:3;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:start;gap:4px;background:transparent;padding:12px 12px max(25px,env(safe-area-inset-bottom));flex-shrink:0}
button{border:0;cursor:pointer}button:active{transform:scale(.94)}
.actions button{width:64px;height:64px;max-width:100%;margin:auto;border-radius:50%;background:#202429;color:white;border:1px solid #343a3e;display:grid;place-items:center;padding:16px}
.actions button svg,.header button svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.actions button.danger{background:#ef3535;border-color:#fa5555;color:white;box-shadow:0 3px 22px rgba(239,53,53,.2)}
.actions button.off{background:#574320;border-color:#b99343;color:#fff}
.smallLabel{color:#d6d8da;font-size:12px;text-align:center;margin-top:9px;white-space:nowrap}
.action{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;min-width:0}
#error{position:absolute;bottom:10px;left:12px;right:12px;padding:10px;border-radius:11px;background:#662626;color:#fff;text-align:center;display:none;z-index:6;font-size:12px}
#retry{display:none;position:relative;width:auto;height:auto;border-radius:12px;padding:9px 15px;background:#d8af51;color:#16120a;font-size:13px;margin:8px auto 0}
@media(max-height:630px){#bigAvatar{min-width:94px;min-height:94px;width:110px;height:110px;margin-bottom:12px}#bigInitial{font-size:48px}.actions button{width:53px;height:53px;padding:13px}.actions{padding-bottom:16px}#peer{font-size:24px}.header{padding:7px 15px}}
html.native-host .page>.header,html.native-host .page>.actions{display:none!important}
html.native-host .stage{padding:0}
html.native-host #bigAvatar,html.native-host #peer,html.native-host #hint,
html.native-host #duration,html.native-host #error{display:none!important}
html.native-host #remoteVideo{object-fit:contain;z-index:1}
html.native-host #localPip{top:72px;right:12px;z-index:5}
html.native-host .stage{isolation:isolate}
</style></head><body><div class="page">
<header class="header"><button aria-label="رجوع وإنهاء المكالمة" onclick="window.__attaEndCall()"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><span class="callKind" id="callKind">مكالمة صوتية</span><span style="width:43px"></span></header>
<div class="stage">
 <div id="bigAvatar"><img id="bigAvatarImg" alt=""><span id="bigInitial">•</span></div>
 <div id="peer">جاري تحميل الاسم...</div>
 <div id="hint">جاري التهيئة...</div>
 <div id="duration"></div>
 <video id="remoteVideo" autoplay playsinline muted></video>
 <canvas id="remoteCanvas" aria-label="فيديو الطرف الآخر"></canvas>
 <div id="localPip"><video id="localVideo" autoplay playsinline muted></video><div id="localCameraPlaceholder">جارٍ تشغيل الكاميرا...</div><span id="localCameraLabel">أنت</span></div>
 <audio id="remoteAudio" autoplay playsinline></audio>
 <div id="error"><span id="errorText"></span><button id="retry" onclick="retryStart()">إعادة المحاولة</button></div>
</div>
<div class="actions">
 <div class="action"><button id="mute" onclick="toggleMute()" aria-label="كتم الميكروفون"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg></button><span class="smallLabel">الميكروفون</span></div>
 <div class="action" id="cameraAction"><button id="camera" onclick="toggleCamera()" aria-label="تشغيل أو إيقاف الكاميرا"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="14" height="14" rx="3"/><path d="m16 10 6-4v12l-6-4"/></svg></button><span class="smallLabel">الكاميرا</span></div>
 <div class="action"><button id="speaker" onclick="toggleSpeaker()" aria-label="السماعة"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5ZM15 9c2 1 2 5 0 6M18 6c4 3 4 9 0 12"/></svg></button><span class="smallLabel">السماعة</span></div>
 <div class="action"><button class="danger" id="hangup" onclick="window.__attaEndCall()" aria-label="إنهاء المكالمة"><svg viewBox="0 0 24 24"><path d="M3 15v-3c5-5 13-5 18 0v3l-4 2-2-4H9l-2 4-4-2Z"/></svg></button><span class="smallLabel">إنهاء</span></div>
</div>
</div>
<script>
'use strict';
document.documentElement.classList.add('native-host');
const cfg=__CONFIG_JSON__;
const BASE='https://tawasol-alatta.omaratta077-4fd.workers.dev';
const types=new Set(['call-request','call-ringing','call-accept','call-reject','offer','answer','ice','hangup']);
let active=true,pc=null,local=null,remote=null,ws=null,offerSent=false,peerPromise=null;
let pending=[],seen=new Set(),candidateCount=0,pollHandle=0,timeoutHandle=0,connectionStarted=Date.now();
let localPreviewFrame=false,remoteFrameConfirmed=false;
const $=id=>document.getElementById(id);
$('callKind').textContent=cfg.type==='video'?'مكالمة فيديو':'مكالمة صوتية';
$('cameraAction').style.visibility=cfg.type==='video'?'visible':'hidden';
$('localPip').style.display=cfg.type==='video'?'block':'none';
// Technical usernames are used for signaling only: never print them on screen.
async function showPeerProfile(){
 try{
   const d=await req('/api/profile-public?username='+encodeURIComponent(cfg.peer)+'&token='+encodeURIComponent(cfg.token));
   const u=d.user||{};
   const name=String(u.fullName||u.displayName||'').trim();
   $('peer').textContent=name||'مستخدم تواصل العطا';
   $('bigInitial').textContent=(name||'م').charAt(0);
   const image=String(u.avatar||'');
   if(image.startsWith('data:image/')||image.startsWith('https://')){
     $('bigAvatarImg').src=image;
     $('bigAvatarImg').style.display='block';
     $('bigInitial').style.display='none';
     $('bigAvatarImg').onerror=()=>{$('bigAvatarImg').style.display='none';$('bigInitial').style.display='block'};
   }
 }catch(_){$('peer').textContent='مستخدم تواصل العطا';$('bigInitial').textContent='م';}
}
showPeerProfile();
let connectedAt=0;
function videoDiagnostic(t){try{AttaBridge.videoDiagnostic(String(t||'').slice(0,180))}catch(_){}}
function status(t){
 $('hint').textContent=t;
 if((t==='متصل الآن'||t==='مكالمة جارية')&&!connectedAt)connectedAt=Date.now();
 try{AttaBridge.onStatus(t)}catch(e){}
}
setInterval(()=>{
 if(!connectedAt||!active)return;
 const total=Math.floor((Date.now()-connectedAt)/1000);
 $('duration').textContent=String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
},1000);
function error(t,canRetry=false){$('errorText').textContent=t;$('error').style.display='block';$('retry').style.display=canRetry?'block':'none';status(t)}
function id(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));}
function isFresh(m){return Date.now()-Number(m.createdAt||m.ts||0)<120000;}
async function req(path,method='GET',body){
 const options={method,cache:'no-store',headers:{'Content-Type':'application/json'}};
 if(body)options.body=JSON.stringify(body);
 const r=await fetch(BASE+path,options);const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'تعذر الاتصال بالخادم');return d;
}
async function transmit(type,data={}){
 const packet={...data,type,to:cfg.peer,from:cfg.me,callId:cfg.callId,callType:cfg.type,signalId:id(),createdAt:Date.now()};
 let realtime=false;
 if(ws&&ws.readyState===1){try{ws.send(JSON.stringify(packet));realtime=true;}catch(e){}}
 // ICE can go over the live socket without creating dozens of saved messages.
 if(type==='ice'&&realtime)return;
 // Persist all critical signals so the website and mobile interoperate even on a lost socket.
 try{return await req('/api/message-send','POST',{token:cfg.token,to:cfg.peer,text:'',media:JSON.stringify(packet),mediaType:'call-signal'});}
 catch(e){if(!realtime)throw e;}
}
function receiveRaw(raw){
 if(!active||!raw)return;
 let s=raw;
 if(raw.type==='chat'&&raw.mediaType==='call-signal'){
   try{s=JSON.parse(raw.media||'{}')}catch(e){return}
   s.from=s.from||raw.from;s.to=s.to||raw.to;s.signalId=s.signalId||raw.id;
 }
 if(!types.has(s.type)||s.from!==cfg.peer||s.callId!==cfg.callId||(s.to&&s.to!==cfg.me)||!isFresh(s))return;
 const unique=s.signalId||s.type+':'+s.createdAt;
 if(seen.has(unique))return;
 seen.add(unique);if(seen.size>400)seen=new Set([...seen].slice(-200));
 handle(s).catch(e=>error('تعذر معالجة الاتصال: '+e.message));
}
function armRemoteVideoPlayback(){
 const video=$('remoteVideo');
 video.style.display='block';
 video.playsInline=true;video.autoplay=true;video.muted=true;
 // A decoded/presented frame is necessary before native overlays are removed.
 // Old code installed a one-shot callback; on some WebViews the first callback
 // reports zero frames, leaving the avatar on top forever.
 if(!video._attaFrameProbe){
  video._attaFrameProbe=true;
  const confirmed=()=>{
   if(!active||remoteFrameConfirmed||!video.srcObject)return;
   remoteFrameConfirmed=true;
   video.style.display='block';
   videoDiagnostic('');
   try{AttaBridge.remoteVideoPlaying()}catch(_){ }
   try{AttaBridge.mediaPlaybackReady()}catch(_){ }
  };
  if(typeof video.requestVideoFrameCallback==='function'){
   const probe=()=>{
    if(!active||remoteFrameConfirmed||!video.srcObject)return;
    try{video.requestVideoFrameCallback((_now,meta)=>{
     if(meta.presentedFrames>0 && video.videoWidth>0)confirmed();
     else probe();
    });}catch(_){ }
   };
   probe();
  }
  video.addEventListener('timeupdate',()=>{
   if(video.videoWidth>0&&video.videoHeight>0&&video.readyState>=2)confirmed();
  });
 }
 video.play().catch(e=>{
  videoDiagnostic('عرض فيديو الطرف الآخر موقوف: '+(e?.name||'play rejected'));
  try{AttaBridge.mediaPlaybackBlocked()}catch(_){ }
 });
}

let canvasTimer=0;
function enableCanvasFallback(){
 const video=$('remoteVideo'),canvas=$('remoteCanvas');
 if(!video.srcObject||!video.videoWidth||!video.videoHeight)return false;
 const width=Math.min(video.videoWidth,800);
 const height=Math.max(1,Math.round(width*video.videoHeight/video.videoWidth));
 canvas.width=width;canvas.height=height;
 const ctx=canvas.getContext('2d',{alpha:false});if(!ctx)return false;
 // Some Android WebViews decode the frame but paint the <video> surface black
 // when it's embedded below a Compose overlay. A 2D canvas is the fallback.
 canvas.style.display='block';
 if(canvasTimer)clearInterval(canvasTimer);
 canvasTimer=setInterval(()=>{
  if(!active||!video.srcObject){clearInterval(canvasTimer);canvasTimer=0;return}
  if(video.readyState>=2){
   try{ctx.drawImage(video,0,0,width,height);
    AttaBridge.remoteVideoPlaying();}catch(_){/* Wait for first frame. */}
  }
 },140);
 return true;
}
window.__attaResumeMedia=async()=>{
 const video=$('remoteVideo');
 const attempts=[];
 if(video.srcObject)attempts.push(video.play());
 if($('remoteAudio').srcObject)attempts.push($('remoteAudio').play());
 if($('localVideo').srcObject)attempts.push($('localVideo').play());
 const results=await Promise.allSettled(attempts);
 if(results.some(x=>x.status==='rejected')){try{AttaBridge.mediaPlaybackBlocked()}catch(_){}}
 else{try{AttaBridge.mediaPlaybackReady()}catch(_){}}
 if(video.videoWidth>0 && video.videoHeight>0){
  enableCanvasFallback();
 }else{
  status('لم تصل إطارات فيديو بعد. تحقق من كاميرا الطرف الآخر والإنترنت.');
 }
};

function connect(){
 try{
 ws=new WebSocket('wss://tawasol-alatta.omaratta077-4fd.workers.dev/ws?token='+encodeURIComponent(cfg.token));
 ws.onmessage=e=>{try{receiveRaw(JSON.parse(e.data))}catch(err){}};
 ws.onclose=()=>{if(active)setTimeout(connect,2400)};
 }catch(e){/* HTTP is the fallback */}
}
async function poll(){
 if(!active)return;
 try{const d=await req('/api/conversation?token='+encodeURIComponent(cfg.token)+'&with='+encodeURIComponent(cfg.peer));
 for(const m of d.messages||[])if(m.mediaType==='call-signal'&&m.to===cfg.me)receiveRaw(m);
 }catch(e){/* live socket may still work */}
}
async function captureMedia(){
 // Match the working website: front camera preferred, with simple-video fallback.
 // Keep this single captured stream for preview AND WebRTC, never open the camera twice.
 const audio={echoCancellation:true,noiseSuppression:true,autoGainControl:true};
 const video=cfg.type==='video'?{facingMode:{ideal:'user'},width:{ideal:1280,max:1280},height:{ideal:720,max:720},frameRate:{ideal:24,max:24}}:false;
 const attempts=[
   {audio,video},
   {audio,video:cfg.type==='video'?true:false},
   {audio:true,video:cfg.type==='video'?true:false}
 ];
 let lastError;
 for(let i=0;i<attempts.length;i++){
   if(!active)return null;
   try{return await navigator.mediaDevices.getUserMedia(attempts[i]);}
   catch(e){
     lastError=e;
     videoDiagnostic('تعذر فتح الكاميرا/الميكروفون ('+(e?.name||'UnknownError')+')'+(i<attempts.length-1?' — تجربة إعداد آخر':'') );
     // Android permission denial is not a constraint issue: ask for permission.
     if(['NotAllowedError','PermissionDeniedError','SecurityError'].includes(e.name))break;
     if(i<attempts.length-1)await new Promise(r=>setTimeout(r,220+i*180));
   }
 }
 if(cfg.type==='video')$('localCameraPlaceholder').textContent='لم تفتح الكاميرا — راجع الأذونات';
 throw lastError||Error('تعذر تشغيل مصدر الصوت');
}
async function mediaAndPeer(){
 if(pc)return pc;
 // Inbound answer/accept and initial startup may overlap. Only one mic capture is allowed.
 if(peerPromise)return peerPromise;
 peerPromise=createPeer();
 try{return await peerPromise;}finally{peerPromise=null;}
}
async function createPeer(){
 status('جاري تشغيل الميكروفون'+(cfg.type==='video'?' والكاميرا':'')+'...');
 const turn=req('/api/turn-credentials?token='+encodeURIComponent(cfg.token)).catch(()=>null);
 local=await captureMedia();
 if(!local)return null;
 if(!active){local.getTracks().forEach(t=>t.stop());return null}
 try{AttaBridge.mediaReady()}catch(e){}
 if(cfg.type==='video'){
  const cameraTracks=local.getVideoTracks();
  if(!cameraTracks.length||cameraTracks[0].readyState!=='live'){
    local.getTracks().forEach(track=>track.stop()); local=null;
    throw Error('لم يتم تشغيل الكاميرا. تحقق من إذن الكاميرا ومن إعدادات خصوصية الهاتف.');
  }
  const preview=$('localVideo');
  const placeholder=$('localCameraPlaceholder');
  placeholder.textContent='جارٍ عرض الكاميرا...';
  placeholder.style.display='grid';
  preview.srcObject=local;
  preview.muted=true;
  preview.autoplay=true;
  preview.playsInline=true;
  const previewReady=()=>{
   if(localPreviewFrame||!active||!preview.srcObject)return;
   localPreviewFrame=true;
   placeholder.style.display='none';
   try{AttaBridge.cameraReady()}catch(_){ }
  };
  // A live MediaStreamTrack is not proof that the video element displayed it.
  // Wait for a frame instead of silently ignoring rejected play() promises.
  // Site-equivalent camera preview: the same local MediaStream feeds the
  // RTCPeerConnection and the small on-screen video, not a second camera capture.
  if(typeof preview.requestVideoFrameCallback==='function'){
   const watchLocalFrame=()=>{
    if(!active||localPreviewFrame||!preview.srcObject)return;
    try{preview.requestVideoFrameCallback((_now,meta)=>{
     if(meta.presentedFrames>0 && preview.videoWidth>0)previewReady();
     else watchLocalFrame();
    });}catch(_){ }
   };
   watchLocalFrame();
  }
  for(const eventName of ['loadeddata','playing','timeupdate']){
   preview.addEventListener(eventName,()=>{
    if(preview.videoWidth>0 && preview.videoHeight>0 && preview.readyState>=2)previewReady();
   });
  }
  preview.play().catch(e=>{
   const reason=e?.name||'play rejected';
   placeholder.textContent='تعذر عرض الكاميرا: '+reason;
   videoDiagnostic('الكاميرا بدأت لكن معاينة الفيديو لم تعمل: '+reason);
   try{AttaBridge.mediaPlaybackBlocked()}catch(_){ }
  });
  setTimeout(()=>{
   if(active&&!localPreviewFrame){
    if(placeholder.textContent==='جارٍ عرض الكاميرا...')
     placeholder.textContent='الكاميرا لا تعرض صورة — راجع الإذن و WebView';
    videoDiagnostic('الكاميرا تعمل لكن المعاينة سوداء: تأكد من إذن الكاميرا، أو حدّث Android System WebView.');
   }
  },6000);
}
 const turnData=await Promise.race([turn,new Promise(resolve=>setTimeout(()=>resolve(null),2200))]);
 const servers=(turnData&&turnData.iceServers&&turnData.iceServers.length)?turnData.iceServers:[{urls:'stun:stun.cloudflare.com:3478'},{urls:'stun:stun.l.google.com:19302'}];
 pc=new RTCPeerConnection({iceServers:servers,iceCandidatePoolSize:2,bundlePolicy:'max-bundle',rtcpMuxPolicy:'require'});
 remote=new MediaStream();
 for(const track of local.getTracks()){
  const sender=pc.addTrack(track,local);
  try{const params=sender.getParameters();params.encodings=params.encodings?.length?params.encodings:[{}];
   params.encodings[0].maxBitrate=track.kind==='video'?600000:40000;
   if(track.kind==='video')params.encodings[0].maxFramerate=18;
   await sender.setParameters(params);
  }catch(e){}
 }
 pc.onicecandidate=e=>{if(e.candidate&&candidateCount++<24)transmit('ice',{candidate:e.candidate.toJSON()}).catch(()=>{});};
 pc.ontrack=e=>{
  if(!remote.getTracks().some(t=>t.id===e.track.id))remote.addTrack(e.track);
  if(e.track.kind==='video'){$('remoteVideo').srcObject=remote;
  // A decoded frame, rather than a premature 'playing' event, unlocks native video UI.
  armRemoteVideoPlayback();}
  if(e.track.kind==='audio'){$('remoteAudio').srcObject=new MediaStream(remote.getAudioTracks());$('remoteAudio').play().catch(()=>{try{AttaBridge.mediaPlaybackBlocked()}catch(_){}});}
  if(e.track.kind==='video')e.track.onunmute=()=>{armRemoteVideoPlayback();};
  // A remote track can arrive before ICE connects. Only connectionState='connected'
  // is evidence that both sides have established the media connection.
 };
 pc.onconnectionstatechange=()=>{if(!pc)return;const c=pc.connectionState;
  if(c==='connected'){
   status('متصل الآن');clearTimeout(timeoutHandle);
   if(cfg.type==='video')setTimeout(async()=>{
    if(active && pc?.connectionState==='connected' && $('remoteVideo').videoWidth===0){
     let decoded=0,received=0;
     try {const stats=await pc.getStats();stats.forEach(item=>{
       if(item.type==='inbound-rtp' && (item.kind==='video'||item.mediaType==='video')){
        decoded+=Number(item.framesDecoded||0);received+=Number(item.bytesReceived||0);
       }
     });}catch(_){}
     const reason=decoded>0
      ?'وصلت إطارات فيديو لكن عرضها متعثر في Android WebView.'
      :received>0
       ?'وصلت بيانات الفيديو لكن الهاتف لم يفك إطارات الصورة.'
       :'لا تصل بيانات فيديو من الطرف الآخر. افحص كاميرته واتصال TURN.';
     videoDiagnostic(reason);
     // Keep the session active; don't falsely show "connected video".
     try{AttaBridge.mediaPlaybackBlocked()}catch(_){ }
    }
   },9000);
  }
  if(c==='disconnected')status('الاتصال غير مستقر — جارٍ إعادة المحاولة...');
  if(c==='failed')error('فشل اتصال الوسائط. تأكد من إعداد TURN والإنترنت');
 };
 return pc;
}
async function gatheringWait(){
 if(!pc||pc.iceGatheringState==='complete')return;
 await new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;pc?.removeEventListener('icegatheringstatechange',watch);resolve()};
 const watch=()=>{if(pc?.iceGatheringState==='complete')finish()};pc.addEventListener('icegatheringstatechange',watch);setTimeout(finish,1400);});
}
async function flush(){if(!pc?.remoteDescription)return;
 const queue=pending;pending=[];for(const c of queue){try{await pc.addIceCandidate(c)}catch(e){}}
}
async function handle(s){
 if(!active)return;
 if(s.type==='call-ringing'&&!cfg.incoming&&!offerSent&&!connectedAt){status('يرن الآن...');return;}
 if(s.type==='call-reject'){error(s.reason==='busy'?'المستخدم مشغول':'تم رفض المكالمة');setTimeout(finish,1600);return;}
 if(s.type==='hangup'){status('انتهت المكالمة');setTimeout(finish,900);return;}
 if(s.type==='call-accept'&&!cfg.incoming&&!offerSent){
  // WebSocket and persisted-message polling may deliver the same accept at once.
  // Mark the offer as in-progress BEFORE awaiting media setup.
  offerSent=true;
  status('تم الرد — جارٍ توصيل الصوت والصورة...');
  try {
   const conn=await mediaAndPeer();
   if(!active||!conn)return;
   const offer=await conn.createOffer({offerToReceiveAudio:true,offerToReceiveVideo:cfg.type==='video'});
   await conn.setLocalDescription(offer);await gatheringWait();
   await transmit('offer',{sdp:conn.localDescription,iceComplete:conn.iceGatheringState==='complete'});
  } catch(e) { offerSent=false; throw e; }
  return;
 }
 if(s.type==='offer'){
  const conn=await mediaAndPeer();if(!conn||!active)return;
  await conn.setRemoteDescription(new RTCSessionDescription(s.sdp));await flush();
  const answer=await conn.createAnswer();await conn.setLocalDescription(answer);await gatheringWait();
  await transmit('answer',{sdp:conn.localDescription,iceComplete:conn.iceGatheringState==='complete'});
  status('جاري إتمام الاتصال');return;
 }
 if(s.type==='answer'&&pc&&pc.signalingState==='have-local-offer'){
  await pc.setRemoteDescription(new RTCSessionDescription(s.sdp));await flush();status('جاري إتمام الاتصال');return;
 }
 if(s.type==='ice'&&s.candidate){if(pc?.remoteDescription){try{await pc.addIceCandidate(s.candidate)}catch(e){}}else pending.push(s.candidate);}
}
async function start(){
 connect();poll();pollHandle=setInterval(poll,2400);
 timeoutHandle=setTimeout(()=>{if(active&&pc?.connectionState!=='connected'){error('لم يتم الرد أو تعذر الاتصال');window.__attaEndCall();}},55000);
 try{
  await mediaAndPeer();if(!active)return;
  if(cfg.incoming){status('جارٍ الرد على المكالمة');await transmit('call-accept');}
  else{status('جارٍ الاتصال...');await transmit('call-request');}
 }catch(e){
  const name=e?.name||'';
  const hint=name==='NotReadableError'||name==='AbortError'
   ?'الميكروفون مشغول أو متوقف من إعدادات الخصوصية. اقفل أي تسجيل أو مكالمة ثانية، وتأكد من السماح للميكروفون ثم جرّب مرة أخرى.'
   :name==='NotAllowedError'||name==='PermissionDeniedError'
   ?'اسمح لتواصل العطا باستخدام الميكروفون والكاميرا من إعدادات التطبيقات.'
   :'تعذر فتح الميكروفون أو الكاميرا: '+(e?.message||name);
  error(hint,true);
 }
}
async function retryStart(){
 if(!active||pc)return;
 $('error').style.display='none';
 try{
   await mediaAndPeer();if(!active)return;
   if(cfg.incoming){status('جارٍ الرد على المكالمة');await transmit('call-accept');}
   else{status('جارٍ الاتصال...');await transmit('call-request');}
 }catch(e){error('تعذر تشغيل مصدر الصوت: '+(e?.message||e?.name||'خطأ غير معروف'),true);}
}
let speakerEnabled=cfg.type==='video';
function toggleSpeaker(){
 speakerEnabled=!speakerEnabled;
 $('speaker').classList.toggle('off',speakerEnabled);
 try{AttaBridge.setSpeaker(speakerEnabled)}catch(e){}
}
function toggleMute(){if(!local)return;const tracks=local.getAudioTracks();tracks.forEach(t=>t.enabled=!t.enabled);$('mute').classList.toggle('off',!tracks[0]?.enabled);}
function toggleCamera(){if(!local)return;const tracks=local.getVideoTracks();tracks.forEach(t=>t.enabled=!t.enabled);$('camera').classList.toggle('off',!tracks[0]?.enabled);}
function cleanup(){active=false;clearInterval(pollHandle);clearTimeout(timeoutHandle);if(canvasTimer)clearInterval(canvasTimer);try{ws?.close()}catch(e){};try{pc?.close()}catch(e){};local?.getTracks().forEach(t=>t.stop());remote?.getTracks().forEach(t=>t.stop());pc=null;}
function finish(){cleanup();try{AttaBridge.close()}catch(e){}}
window.__attaEndCall=async()=>{if(!active)return;try{await Promise.race([transmit('hangup'),new Promise(r=>setTimeout(r,1200))])}catch(e){}finish()};
window.addEventListener('pagehide',cleanup);
start();
</script></body></html>
