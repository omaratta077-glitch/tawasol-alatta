<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>المصحف الشريف — تواصل العطا</title>
<style>
@font-face{font-family:AttaQuran;src:url("fonts/AmiriQuran-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
/* Preserve readable text; dense Quran pages scroll instead of shrinking the glyphs. */
:root{--paper:#fff9e9;--ink:#17120d;--sepia:#884300;--accent:#9d540e;--border:#d7b893;--shade:#f0e2cb}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--paper);color:var(--ink)}
body{font-family:'Noto Naskh Arabic','Noto Sans Arabic','Traditional Arabic',serif;display:flex;flex-direction:column}
button,select,input{font:inherit;direction:rtl;text-align:right}button{cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.toolbar{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:4px 11px;background:var(--paper);border-bottom:1px solid #efe5d1;direction:rtl}
.toolbar .group{display:flex;align-items:center;gap:5px;min-width:0}
.top-pill{border:1.5px solid var(--border);border-radius:20px;padding:2px 10px;color:var(--sepia);background:#f4ead9;font:700 14px/1.5 'Noto Naskh Arabic',sans-serif;white-space:nowrap;height:32px;max-width:116px;overflow:hidden;text-overflow:ellipsis}
.icon-button{text-align:center;width:32px;height:34px;display:grid;place-items:center;background:transparent;border:0;color:var(--sepia);font:700 24px/1 sans-serif;flex:none}
.icon-button.bookmark{font-size:22px}.icon-button.bookmark.selected{color:#a26c0e}.icon-button.index{font-size:22px}
#reader{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:5px 11px 7px;background:var(--paper)}
#pageText{width:100%;max-width:650px;flex:0 0 auto;margin:auto;font-family:AttaQuran,'Noto Naskh Arabic','Noto Sans Arabic','Traditional Arabic',serif;font-size:30px;line-height:2.05;text-align:center;direction:rtl;color:#0d0b09;font-weight:400;word-spacing:normal;letter-spacing:normal;overflow-wrap:normal;word-break:normal}
.ayah{cursor:pointer;border-radius:3px;-webkit-tap-highlight-color:#ead5af;transition:background-color .1s;unicode-bidi:normal}
.ayah:active,.ayah.active{background:#f5e5bd}
.verse-num{color:#995c1c;white-space:nowrap;display:inline-block;font-size:.64em;border:1px solid #c9aa72;border-radius:50%;min-width:1.55em;text-align:center;padding:0 .11em;line-height:1.7;vertical-align:middle;margin:0 .1em}
.surah-heading{font:400 1.12em/1.7 AttaQuran,serif;text-align:center;display:block;color:var(--sepia);padding:3px 4px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:6px 0 4px;background:#fff6e6}
.basmalah{display:block;text-align:center;line-height:1.65;font-size:1.04em;margin:3px 0 7px}
.loading,.empty{font:16px/1.9 'Noto Naskh Arabic',sans-serif;text-align:center;padding:24px 12px;color:#86551f}
.foot{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 11px;background:var(--paper);border-top:1px solid #efe5d1;direction:rtl}
.foot .page-count{border-radius:22px;background:var(--shade);color:var(--sepia);padding:2px 12px;font:14px/1.7 'Noto Naskh Arabic',sans-serif;text-align:center;white-space:nowrap}
.page-arrow{text-align:center;width:36px;height:34px;border:0;border-radius:9px;background:#e5cfb2;color:var(--sepia);font:700 26px/1 sans-serif;flex:none}
.overlay{display:none;position:fixed;inset:0;z-index:10;background:#1b120984;align-items:center;justify-content:center;padding:12px;overscroll-behavior:contain}
.overlay.open{display:flex}
.sheet{background:var(--paper);width:100%;max-width:540px;max-height:calc(100% - 12px);border:1px solid var(--border);border-radius:16px;box-shadow:0 9px 35px #0003;display:flex;flex-direction:column;overflow:hidden;padding:10px 12px 12px}
#indexOverlay .sheet{height:min(79vh,630px)}
#verseOverlay .sheet{height:min(70vh,510px);min-height:250px}
.sheet-header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);padding-bottom:6px;font:700 17px/1.5 'Noto Naskh Arabic',serif}
.close{width:32px;height:32px;flex:none;border:none;border-radius:50%;background:var(--shade);color:var(--sepia);font:22px/1 sans-serif}
.sheet-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 1px;overscroll-behavior:contain}
.tabs{flex:none;display:flex;gap:4px;padding:6px 0;overflow-x:auto}
.tab{flex:1;border:1px solid var(--border);background:#fff8e9;color:var(--sepia);border-radius:9px;padding:6px 2px;white-space:nowrap;font:12px/1.4 sans-serif}
.tab.active{background:var(--sepia);color:white}
.search-box{width:100%;padding:9px;border:1px solid var(--border);border-radius:9px;background:white;color:#23170b;margin:5px 0;font-size:14px}
.index-item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:right;border:0;border-bottom:1px solid #e4d4be;background:transparent;padding:8px 5px;color:#38210f;font-size:15px;gap:8px}
.index-item small{color:#966328;font-size:12px}
.verse-label{font-size:16px;color:var(--sepia);font-weight:bold}
.verse-preview{font-family:AttaQuran,serif;font-size:25px;line-height:1.95;margin:5px 0 9px}
.choice{display:flex;flex-direction:column;gap:7px;margin:8px 0}
.choice button{width:100%;background:#f3e4cf;color:#683607;border:1px solid var(--border);border-radius:9px;padding:9px 5px;font-size:15px}
.choice button.primary{background:var(--sepia);color:white}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;justify-content:space-between;font-size:14px}
.row select{flex:1;min-width:0;background:#fffaf0;color:#4c2c11;padding:7px;border:1px solid var(--border);border-radius:8px;font-size:14px}
#tafsirText{white-space:pre-wrap;font-size:20px;line-height:1.8;color:#28211a;margin:6px 0}
#audioBar{display:none;position:fixed;bottom:49px;left:8px;right:8px;z-index:4;border:1px solid #d5b180;border-radius:12px;background:#fff8eafa;box-shadow:0 4px 20px #0002;padding:7px;direction:rtl;align-items:center;gap:7px}
#audioBar button{border:0;border-radius:50%;background:#9a550f;color:white;width:34px;height:34px;flex:none;font-size:18px}
#audioBar #audioName{flex:1;font:13px/1.6 'Noto Naskh Arabic',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#audioBar .stop{background:#70462a}
.note{font-size:12px;line-height:1.6;color:#775634}
@media(max-width:360px){.toolbar{padding:3px 6px}.top-pill{font-size:13px;padding:2px 7px;max-width:100px}.icon-button{text-align:center;width:29px}.foot .page-count{font-size:12px;padding:2px 7px}#reader{padding-left:8px;padding-right:8px}.tab{font-size:11px}}
@media(max-height:550px){.toolbar{height:45px}.foot{height:40px}#verseOverlay .sheet{height:88vh}}

.reading-tools{display:flex;align-items:center;justify-content:center;gap:9px;flex:none;padding:4px 8px;border-bottom:1px solid #e9dbc1;font:14px/1.5 sans-serif;background:var(--paper);min-height:42px}
.reading-tools button{height:32px;min-width:34px;text-align:center;border:1px solid var(--border);border-radius:8px;color:#633707;background:var(--paper);font:700 19px/1 sans-serif}
.reading-tools #contrastButton{font:13px/1 sans-serif;padding:0 8px}
.reading-tools button:disabled{opacity:.4}
html[data-contrast="white"]{--paper:#fff;--ink:#080808;--sepia:#5d2d00;--shade:#eee;--border:#bfa579}
html[data-contrast="white"] #pageText{color:#080808}
@media(max-width:360px){.reading-tools{gap:6px;font-size:12px}.reading-tools #contrastButton{font-size:12px}}
</style>
</head>
<body>
<header class="toolbar" aria-label="أدوات المصحف">
 <div class="group"><button class="icon-button bookmark" id="bookmarkButton" aria-label="حفظ علامة عند الصفحة">▮</button><button class="top-pill" id="juzButton">الجزء ١</button></div>
 <button class="icon-button index" id="indexButton" aria-label="فهرس المصحف">▦</button>
 <div class="group"><button class="icon-button" id="searchButton" aria-label="البحث في السور">⌕</button><button class="top-pill" id="surahButton">الفاتحة</button></div>
</header>
<div class="reading-tools" aria-label="وضوح القراءة"><span>حجم الخط</span><button id="fontSmaller" aria-label="تصغير الخط">−</button><output id="fontSizeLabel">٣٠</output><button id="fontLarger" aria-label="تكبير الخط">+</button><button id="contrastButton" aria-pressed="false">خلفية بيضاء</button></div>
<main id="reader" aria-live="polite"><section id="pageText" aria-label="آيات المصحف"><div class="loading">جارٍ تحميل المصحف الشريف...</div></section></main>
<footer class="foot" aria-label="التنقل بين صفحات المصحف"><button class="page-arrow" id="nextButton" aria-label="الصفحة التالية">‹</button><div class="page-count" id="pageCount">١ / ٦٠٤</div><button class="page-arrow" id="prevButton" aria-label="الصفحة السابقة">›</button></footer>
<div id="audioBar"><button id="pauseAudio" aria-label="إيقاف مؤقت">Ⅱ</button><span id="audioName"></span><button id="stopAudio" class="stop" aria-label="إيقاف التلاوة">×</button></div>
<div class="overlay" id="indexOverlay" role="dialog" aria-modal="true" aria-label="الفهرس"><div class="sheet">
 <div class="sheet-header"><span>فهرس المصحف الشريف</span><button class="close" data-close aria-label="إغلاق">×</button></div>
 <div class="tabs"><button class="tab active" data-tab="surah">السور ١١٤</button><button class="tab" data-tab="juz">الأجزاء ٣٠</button><button class="tab" data-tab="quarter">أرباع الأحزاب ٢٤٠</button><button class="tab" data-tab="page">الصفحات ٦٠٤</button></div>
 <div class="sheet-body"><input class="search-box" id="indexSearch" placeholder="ابحث عن اسم السورة أو رقم الجزء..." type="search" /><div id="indexList"><div class="loading">جارٍ تحميل الفهرس...</div></div></div>
</div></div>
<div class="overlay" id="verseOverlay" role="dialog" aria-modal="true" aria-label="خيارات الآية"><div class="sheet">
 <div class="sheet-header"><span id="verseTitle">الآية</span><button class="close" data-close aria-label="إغلاق">×</button></div>
 <div class="sheet-body"><div class="verse-preview" id="versePreview"></div>
 <div class="row"><label for="reciter">القارئ</label><select id="reciter">
 <option value="ar.minshawi">محمد صديق المنشاوي — مرتل</option>
 <option value="ar.minshawimujawwad">محمد صديق المنشاوي — مجود</option>
 <option value="ar.abdulbasit">عبد الباسط عبد الصمد — مرتل</option>
 <option value="ar.abdulbasitmujawwad">عبد الباسط عبد الصمد — مجود</option>
 <option value="ar.husary">محمود خليل الحصري</option>
 </select></div>
 <div class="choice"><button class="primary" id="playHere">▶ تشغيل من هذه الآية</button><button id="playSurah">▶ تشغيل من أول السورة</button><button id="showTafsir">عرض التفسير الميسر</button></div>
 <div id="tafsirText" aria-live="polite"></div><p class="note">القراءة والتفسير والتسجيلات تُحمَّل عبر الإنترنت من خدمة القرآن السحابية. التفسير يُعرض منفصلًا عن نص المصحف.</p></div>
</div></div>
<audio id="recitation" preload="none"></audio>
<script>
'use strict';
const API='https://api.alquran.cloud/v1';
const $=id=>document.getElementById(id);
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[Number(d)]);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const pageMemory='atta-quran-last-page-v1', bookmarkMemory='atta-quran-bookmark-v1';
let page=1, surahs=[], ayahs=[], selected=null, indexTab='surah', holdTimer=0, holdActivated=false;
let recitationItems=[], recitationIndex=0, playingSurah=0, loadSerial=0, audioSerial=0, previousTouchX=0;
let readingSize=30, whitePaper=false, previousTouchY=0, multipleTouches=false;
let preferredReciter='ar.minshawi';
try {page=clamp(Number(localStorage.getItem(pageMemory))||1,1,604);preferredReciter=localStorage.getItem('atta-quran-reciter-v1')||preferredReciter;}catch(_){}
$('reciter').value=[...$('reciter').options].some(o=>o.value===preferredReciter)?preferredReciter:'ar.minshawi';
try{readingSize=clamp(Number(localStorage.getItem('atta-quran-font-size-v1'))||30,24,44);whitePaper=localStorage.getItem('atta-quran-white-v1')==='true';}catch(_){}
const sanitize=s=>String(s||'').replace(/[\u200b\u200c]/g,'').trim();
function errText(e){return e&&e.message?e.message:'تعذر الاتصال بمصدر القرآن';}
const pageCachePrefix='atta-quran-page-cache-v1:';
function validPage(data,path){
 const number=Number(path.split('/')[2]);
 return data && Number(data.number)===number && Array.isArray(data.ayahs) && data.ayahs.length>0 &&
  data.ayahs.every(a=>typeof a.text==='string' && a.text.trim() && Number(a.surah?.number)>=1 && Number(a.surah?.number)<=114 && Number(a.numberInSurah)>0);
}
async function get(path){
 const cacheable=/^\/page\/\d+\/quran-uthmani$/.test(path),key=pageCachePrefix+path;
 if(cacheable)try{const cached=JSON.parse(localStorage.getItem(key)||'null');if(validPage(cached,path))return cached;}catch(_){}
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);
 try{
  const res=await fetch(API+path,{cache:'default',signal:controller.signal});
  if(!res.ok)throw Error('الخدمة غير متاحة ('+res.status+')');
  const data=await res.json();if(data.code!==200||!data.data || cacheable&&!validPage(data.data,path))throw Error('البيانات غير مكتملة');
  if(cacheable)try{
   const keys=Object.keys(localStorage).filter(k=>k.startsWith(pageCachePrefix));
   while(keys.length>=24)localStorage.removeItem(keys.shift());
   localStorage.setItem(key,JSON.stringify(data.data));
  }catch(_){}
  return data.data;
 }catch(e){if(e.name==='AbortError')throw Error('انتهت مهلة التحميل. اضغط إعادة المحاولة');throw e;}
 finally{clearTimeout(timer);}
}
function overlay(id,on){$(id).classList.toggle('open',on);}
function closeOverlays(){overlay('indexOverlay',false);overlay('verseOverlay',false)}
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeOverlays));
['indexOverlay','verseOverlay'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target===$(id))closeOverlays()}));
function surahName(n){return surahs.find(s=>s.number===n)?.name?.replace(/^سُورَةُ\s*/, '') || 'سورة '+ar(n);}
function pageTitle(verse){let name=verse?.surah?.name||surahName(verse?.surah?.number);return String(name||'القرآن').replace(/^سُورَةُ\s*/,'');}
function marker(n){return '﴿'+ar(n)+'﴾';}
function showBookmark(){let value=0;try{value=Number(localStorage.getItem(bookmarkMemory))||0}catch(_){} $('bookmarkButton').classList.toggle('selected',value===page);$('bookmarkButton').title=value?'العلامة عند صفحة '+ar(value):'حفظ الصفحة';}
// A user's chosen size is fixed on both short and dense pages; never auto-shrink.
function applyReadingStyle(){
 $('pageText').style.fontSize=readingSize+'px';
 $('fontSizeLabel').textContent=ar(readingSize);
 $('fontSmaller').disabled=readingSize<=24;$('fontLarger').disabled=readingSize>=44;
 document.documentElement.dataset.contrast=whitePaper?'white':'paper';
 $('contrastButton').setAttribute('aria-pressed',String(whitePaper));
 $('contrastButton').textContent=whitePaper?'خلفية ورقية':'خلفية بيضاء';
 try{localStorage.setItem('atta-quran-font-size-v1',String(readingSize));localStorage.setItem('atta-quran-white-v1',String(whitePaper));}catch(_){}
}
$('fontSmaller').onclick=()=>{readingSize=clamp(readingSize-2,24,44);applyReadingStyle()};
$('fontLarger').onclick=()=>{readingSize=clamp(readingSize+2,24,44);applyReadingStyle()};
$('contrastButton').onclick=()=>{whitePaper=!whitePaper;applyReadingStyle()};
window.addEventListener('resize',applyReadingStyle);
applyReadingStyle();
window.attaQuranBack=function(){
 const hasSheet=document.querySelector('.overlay.open');
 if(hasSheet){closeOverlays();return true;}
 return false;
};
function loadPage(number){
 closeOverlays();page=clamp(Number(number)||1,1,604);const serial=++loadSerial;
 $('pageText').replaceChildren();const loader=document.createElement('div');loader.className='loading';loader.textContent='جارٍ تحميل الصفحة '+ar(page)+'...';$('pageText').append(loader);
 $('pageCount').textContent=ar(page)+' / ٦٠٤';$('reader').scrollTop=0;showBookmark();
 try {localStorage.setItem(pageMemory,String(page));}catch(_){}
 get('/page/'+page+'/quran-uthmani').then(data=>{
  if(serial!==loadSerial)return;
  ayahs=Array.isArray(data.ayahs)?data.ayahs:[];
  if(!ayahs.length)throw Error('الصفحة لا تحتوي آيات');
  const first=ayahs[0];$('juzButton').textContent='الجزء '+ar(first.juz||1);$('surahButton').textContent=pageTitle(first);
  const quarter=Number(first.hizbQuarter||1);const hizb=Math.ceil(quarter/4);
  $('pageCount').textContent=ar(page)+'   ·   الحزب '+ar(hizb)+'   ·   الربع '+ar(((quarter-1)%4)+1);
  const root=$('pageText');root.replaceChildren();
  for(const ayah of ayahs){
   const surah=Number(ayah.surah?.number||0);const number=Number(ayah.numberInSurah||0);
   let displayText=sanitize(ayah.text);
   if(number===1){
    const heading=document.createElement('div');heading.className='surah-heading';heading.textContent='۞ '+(ayah.surah?.name||surahName(surah))+' ۞';root.append(heading);
    // The Uthmani provider includes the basmalah in verse 1 of these surahs.
    // Split its original glyphs for layout only; never add a duplicate or rewrite the verse.
    if(surah!==1 && surah!==9){
     const parts=displayText.match(/^(\S+\s+\S+\s+\S+\s+\S+)\s+([\s\S]+)$/);
     const plain=parts?.[1].normalize('NFD').replace(/[\u0610-\u061a\u064b-\u065f\u0670\u06d6-\u06ed]/g,'').replace(/ٱ/g,'ا');
     if(plain==='بسم الله الرحمن الرحيم'){
      const basmalah=document.createElement('div');basmalah.className='basmalah';basmalah.textContent=parts[1];root.append(basmalah);displayText=parts[2];
     }
    }
   }
   const span=document.createElement('span');span.className='ayah';span.tabIndex=0;span.setAttribute('role','button');span.setAttribute('aria-label','الآية '+ar(number)+' — خيارات التلاوة والتفسير');
   const text=document.createElement('span');text.textContent=displayText+' ';
   const label=document.createElement('span');label.className='verse-num';label.textContent=ar(number);span.append(text,label,document.createTextNode(' '));
   span.addEventListener('click',e=>{if(holdActivated){holdActivated=false;return}openVerse(ayah,false)});
   span.addEventListener('contextmenu',e=>{e.preventDefault();openVerse(ayah,true)});
   span.addEventListener('touchstart',()=>{holdActivated=false;clearTimeout(holdTimer);holdTimer=setTimeout(()=>{holdActivated=true;openVerse(ayah,true)},600)},{passive:true});
   ['touchend','touchmove','touchcancel'].forEach(name=>span.addEventListener(name,()=>clearTimeout(holdTimer),{passive:true}));
   span.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openVerse(ayah,false)}});
   root.append(span);
  }
  applyReadingStyle();
 }).catch(e=>{if(serial!==loadSerial)return;$('pageText').innerHTML='';const x=document.createElement('div');x.className='empty';x.textContent='تعذر تحميل هذه الصفحة. تأكد من الإنترنت. '+errText(e);const retry=document.createElement('button');retry.className='top-pill';retry.textContent='إعادة المحاولة';retry.onclick=()=>loadPage(page);x.append(document.createElement('br'),retry);$('pageText').append(x)});
}
function openVerse(ayah,showExplanation){selected=ayah;$('verseTitle').textContent='سورة '+pageTitle(ayah)+' — الآية '+ar(ayah.numberInSurah);$('versePreview').textContent=sanitize(ayah.text)+' '+marker(ayah.numberInSurah);$('tafsirText').textContent='';overlay('verseOverlay',true);if(showExplanation)loadTafsir();}
async function loadTafsir(){if(!selected)return;const key=selected.surah.number+':'+selected.numberInSurah;const current=selected;$('tafsirText').textContent='جارٍ تحميل التفسير الميسر...';try{const d=await get('/ayah/'+key+'/ar.muyassar');if(selected===current)$('tafsirText').textContent=sanitize(d.text)||'لا يوجد نص تفسير متاح لهذه الآية.';}catch(e){if(selected===current)$('tafsirText').textContent='تعذر تحميل التفسير الميسر الآن. '+errText(e)}}
$('showTafsir').addEventListener('click',loadTafsir);
function stopRecitation(){audioSerial++;const audio=$('recitation');audio.pause();audio.removeAttribute('src');audio.load();recitationItems=[];recitationIndex=0;playingSurah=0;$('audioBar').style.display='none';}
async function startRecitation(fromStart){if(!selected)return;const target=selected;const surah=Number(target.surah.number);const startVerse=fromStart?1:Number(target.numberInSurah);const reciter=$('reciter').value;try{localStorage.setItem('atta-quran-reciter-v1',reciter);}catch(_){}
 closeOverlays();stopRecitation();const request=audioSerial;$('audioBar').style.display='flex';$('audioName').textContent='جارٍ تحميل تلاوة '+surahName(surah)+'...';
 try{const result=await get('/surah/'+surah+'/'+encodeURIComponent(reciter));if(request!==audioSerial)return;if(!Array.isArray(result.ayahs)||!result.ayahs.length)throw Error('تلاوة القارئ غير متاحة');recitationItems=result.ayahs.filter(a=>a.audio&&a.numberInSurah>=startVerse);if(!recitationItems.length)throw Error('التسجيل المطلوب غير موجود');recitationIndex=0;playingSurah=surah;playCurrent();}
 catch(e){if(request!==audioSerial)return;$('audioName').textContent='تعذر تشغيل القارئ: '+errText(e);$('pauseAudio').textContent='!';}
}
function playCurrent(){const item=recitationItems[recitationIndex];if(!item){stopRecitation();return;} const audio=$('recitation');const reciterName=$('reciter').selectedOptions[0]?.textContent||'القارئ';$('audioName').textContent=surahName(playingSurah)+' — '+ar(item.numberInSurah)+' — '+reciterName;audio.src=item.audio;audio.play().then(()=>{$('pauseAudio').textContent='Ⅱ'}).catch(()=>{$('audioName').textContent='اضغط تشغيل للسماح بالصوت';$('pauseAudio').textContent='▶'});}
$('recitation').addEventListener('ended',()=>{if(recitationIndex+1<recitationItems.length){recitationIndex++;playCurrent()}else stopRecitation()});
$('recitation').addEventListener('error',()=>{$('audioName').textContent='تسجيل هذه الآية غير متاح — جرّب قارئًا آخر';$('pauseAudio').textContent='▶'});
$('pauseAudio').addEventListener('click',()=>{const audio=$('recitation');if(!audio.src)return;if(audio.paused){audio.play().then(()=>{$('pauseAudio').textContent='Ⅱ'}).catch(()=>{})}else{audio.pause();$('pauseAudio').textContent='▶'}});
$('stopAudio').addEventListener('click',stopRecitation);$('playHere').addEventListener('click',()=>startRecitation(false));$('playSurah').addEventListener('click',()=>startRecitation(true));
async function initIndex(){if(surahs.length)return;try{const data=await get('/surah');if(!Array.isArray(data)||data.length!==114)throw Error('فهرس السور غير مكتمل');surahs=data;renderIndex();}catch(e){$('indexList').textContent='تعذر تحميل فهرس السور: '+errText(e);}}
function indexOpen(tab='surah',filter=''){indexTab=tab;$('indexSearch').value=filter;overlay('indexOverlay',true);document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===indexTab));renderIndex();if(tab==='surah')initIndex();}
function jumpToSegment(path){$('indexList').textContent='جارٍ الوصول إلى الموضع...';get(path).then(data=>{const ayah=data.ayahs?.[0];if(!ayah||!ayah.page)throw Error('تعذر تحديد بداية الجزء');closeOverlays();loadPage(ayah.page);}).catch(e=>{$('indexList').textContent='تعذر فتح هذا الموضع: '+errText(e)});}
function renderIndex(){const list=$('indexList');list.replaceChildren();const q=$('indexSearch').value.trim();
 const item=(title,extra,action)=>{const b=document.createElement('button');b.className='index-item';const a=document.createElement('span');a.textContent=title;const small=document.createElement('small');small.textContent=extra;b.append(a,small);b.onclick=action;list.append(b)};
 if(indexTab==='surah'){
  if(!surahs.length){list.textContent='جارٍ تحميل قائمة السور...';return;}
  surahs.filter(s=>!q||s.name.includes(q)||String(s.number)===q).forEach(s=>item(ar(s.number)+'  '+s.name,ar(s.numberOfAyahs)+' آية',()=>jumpToSegment('/surah/'+s.number+'/quran-uthmani?limit=1')));
 }else if(indexTab==='juz'){for(let j=1;j<=30;j++)if(!q||String(j).includes(q)||ar(j).includes(q))item('الجزء '+ar(j),'فتح بداية الجزء',()=>jumpToSegment('/juz/'+j+'/quran-uthmani?limit=1'));
 }else if(indexTab==='quarter'){for(let j=1;j<=240;j++)if(!q||String(j).includes(q)||ar(j).includes(q))item('الربع '+ar(j),'الحزب '+ar(Math.ceil(j/4))+' — الجزء '+ar(Math.ceil(j/8)),()=>jumpToSegment('/hizbQuarter/'+j+'/quran-uthmani?limit=1'));
 }else{for(let j=1;j<=604;j++)if(!q||String(j).includes(q)||ar(j).includes(q))item('صفحة '+ar(j),'من ٦٠٤ صفحة',()=>{closeOverlays();loadPage(j)})}
 if(!list.children.length)list.textContent='لا توجد نتائج مطابقة.';
}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{indexTab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));renderIndex()}));
$('indexSearch').addEventListener('input',renderIndex);
$('indexButton').onclick=()=>indexOpen('surah');$('surahButton').onclick=()=>indexOpen('surah');$('juzButton').onclick=()=>indexOpen('juz');$('searchButton').onclick=()=>indexOpen('surah');
$('bookmarkButton').onclick=()=>{let stored=0;try{stored=Number(localStorage.getItem(bookmarkMemory))||0;}catch(_){}if(stored===page){indexOpen('page',String(stored));return;}try{localStorage.setItem(bookmarkMemory,String(page))}catch(_){}showBookmark()};
$('prevButton').onclick=()=>loadPage(page-1);$('nextButton').onclick=()=>loadPage(page+1);
$('reader').addEventListener('touchstart',e=>{multipleTouches=e.touches.length!==1;if(!multipleTouches){previousTouchX=e.touches[0].clientX;previousTouchY=e.touches[0].clientY}},{passive:true});
$('reader').addEventListener('touchmove',e=>{if(e.touches.length!==1)multipleTouches=true;},{passive:true});
$('reader').addEventListener('touchend',e=>{
 if(e.changedTouches.length!==1||multipleTouches)return;
 const delta=e.changedTouches[0].clientX-previousTouchX,vertical=Math.abs(e.changedTouches[0].clientY-previousTouchY);
 if(Math.abs(delta)>125 && Math.abs(delta)>vertical*1.5 && !document.querySelector('.overlay.open'))loadPage(page+(delta>0?1:-1));
},{passive:true});
// The native Android back button dismisses an open sheet before leaving the reader.
window.addEventListener('pagehide',stopRecitation);
loadPage(page);initIndex();
</script>
</body></html>
