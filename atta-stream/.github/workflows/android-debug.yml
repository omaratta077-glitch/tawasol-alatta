name: Build Atta Stream APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, atta-stream-build-v1]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Name debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AttaStream_v1.0.1_debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AttaStream-v1.0.1-debug-APK
          path: AttaStream_v1.0.1_debug.apk
          if-no-files-found: error
