name: ATTA STREAM Android APK
on:
  push:
    branches:
      - atta-stream-build-v1
    paths:
      - 'atta-stream/**'
      - '.github/workflows/atta-stream-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: atta-stream
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AttaStream_v1.0.2_debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttaStream-v1.0.2-debug-APK
          path: atta-stream/AttaStream_v1.0.2_debug.apk
          if-no-files-found: error
