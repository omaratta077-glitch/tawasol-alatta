name: Build AL-ATTA Official Release APK

on:
  workflow_dispatch:
  # Build and publish a public APK after pushing a new Android version to main.
  push:
    branches:
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native-release.yml'
      - 'scripts/check_store_apk.py'
      - 'scripts/test_store_apk.py'

permissions:
  contents: write

concurrency:
  group: alatta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable-v1.0.65-4-'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify native source and version
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::Native verification failed at shell line $LINENO: $BASH_COMMAND"' ERR
          BUILD_FILE=android-native/app/build.gradle.kts
          MAIN_FILE=android-native/app/src/main/java/com/alatta/nativeapp/MainActivity.kt
          GOOGLE_FILE=android-native/app/src/main/java/com/alatta/nativeapp/GoogleNativeSignIn.kt
          test -f "$BUILD_FILE"
          test -f "$MAIN_FILE"
          test -f "$GOOGLE_FILE"
          RELEASE_VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' "$BUILD_FILE" | head -n 1)"
          RELEASE_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$BUILD_FILE" | head -n 1)"
          test -n "$RELEASE_VERSION" && test -n "$RELEASE_CODE" || {
            echo '::error::Could not extract Android versionName/versionCode'
            exit 1
          }
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "Release version $RELEASE_VERSION (code $RELEASE_CODE)"
          grep -Fq 'GoogleNativeSignIn.pickAccount' "$MAIN_FILE" || {
            echo '::error::Native Google account picker call is missing from MainActivity.kt'
            exit 1
          }
          grep -Fq '/api/google-login' "$MAIN_FILE" || {
            echo '::error::Native Google server login endpoint is missing from MainActivity.kt'
            exit 1
          }
          if grep -Eq 'GoogleWebBridge\.begin|android-google-auth\.html' "$MAIN_FILE"; then
            echo '::error::Old browser-based Google login still present in MainActivity.kt'
            exit 1
          fi
          CHAT_FILE=android-native/app/src/main/java/com/alatta/nativeapp/MessengerChat.kt
          test -s "$CHAT_FILE"
          grep -q 'MessengerInbox(' "$MAIN_FILE"
          grep -q 'MessengerThread(' "$MAIN_FILE"
          grep -q 'api/conversation' "$MAIN_FILE"
          test -s android-native/app/src/main/java/com/alatta/nativeapp/NativeCallScreen.kt
          test -s android-native/app/src/main/java/com/alatta/nativeapp/UserProfileScreen.kt
          test -s android-native/app/src/main/java/com/alatta/nativeapp/NativeRtcCall.kt
          grep -q 'io.github.webrtc-sdk:android:' "$BUILD_FILE"
          grep -q 'SurfaceViewRenderer' android-native/app/src/main/java/com/alatta/nativeapp/NativeCallScreen.kt
          test ! -e android-native/app/src/main/assets/atta-call.html
          test -s android-native/app/src/main/java/com/alatta/nativeapp/AttaExpandableVideo.kt
          grep -Eq 'ProfileMediaImage\(|ExpandableProfileMedia\(' "$MAIN_FILE" || {
            echo '::error::Profile media component invocation is missing from MainActivity.kt'
            exit 1
          }
          grep -q 'AttaExpandableVideo(url)' "$MAIN_FILE"
          grep -q 'call-accept' android-native/app/src/main/java/com/alatta/nativeapp/NativeRtcCall.kt
          grep -q 'chatVideoPicker.launch' "$MAIN_FILE"
          grep -q 'PublicUserProfile(' "$MAIN_FILE"
          grep -q 'NativeCallScreen(' "$MAIN_FILE"
          grep -q 'uploadChatMedia' "$MAIN_FILE"
          grep -q 'onVoiceCall' "$MAIN_FILE"
          if grep -q 'اختر صديقًا للمراسلة' "$MAIN_FILE"; then
            echo '::error::Old chat UI detected'
            exit 1
          fi
          PROFILE_FILE=android-native/app/src/main/java/com/alatta/nativeapp/ProfileMedia.kt
          test -s "$PROFILE_FILE"
          grep -q 'profileAvatarPicker.launch' "$MAIN_FILE"
          grep -q 'profileCoverPicker.launch' "$MAIN_FILE"
          grep -q 'encodeProfileImage' "$MAIN_FILE"
          grep -q 'ProfileMediaImage' "$PROFILE_FILE"
          grep -q 'onPickDocument' "$MAIN_FILE"
          grep -q 'onPickAudio' "$MAIN_FILE"
          grep -q 'ModalBottomSheet' "$CHAT_FILE"
          grep -q 'nativeUsernameSignup' "$MAIN_FILE"
          if grep -q 'Text("@\$username"' android-native/app/src/main/java/com/alatta/nativeapp/UserProfileScreen.kt; then
            echo '::error::Username is still shown under public display name'
            exit 1
          fi
          echo 'Native Google sign-in, Messenger, profile media editor, and release version verified.' 

      - name: Verify code and regression tests before official signing
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_core.py
          node scripts/test_backend.mjs
          node scripts/test_audit_security.mjs
          node scripts/test_inbox_summary.mjs
          node scripts/test_feed_paging.mjs
          node scripts/test_media_ranges.mjs
          node scripts/test_post_interactions.mjs
          node scripts/test_football_catalog.mjs
          node scripts/test_privacy_admin_reset.mjs
          node scripts/test_full_reset.mjs
          node scripts/test_owner_change.mjs
          node scripts/test_admin_management.mjs
          node scripts/test_admin_management_ui.mjs
          node scripts/test_call_signaling_fast.mjs
          node scripts/test_admin_reset_ui.mjs
          node scripts/test_google_signup_pbkdf_cap.mjs
          node scripts/verify_sources.mjs
          node scripts/test_youtube_single_origin.mjs
          node scripts/test_call_ringing.mjs
          node scripts/test_mobile_call_fallback.mjs
          node scripts/test_call_push.mjs
          node scripts/test_fcm_reserved_key.mjs
          node scripts/test_call_video_stage.mjs
          node scripts/test_quran_reader.mjs
          node scripts/test_call_history.mjs
          node scripts/test_social_push.mjs
          node scripts/test_appgallery_privacy.mjs
          python3 scripts/test_huawei_config.py
          python3 scripts/test_store_apk.py

      - name: Prepare optional Huawei client configuration
        env:
          ALATTA_HMS_AGCONNECT_JSON: ${{ secrets.ALATTA_HMS_AGCONNECT_JSON }}
          ALATTA_HMS_APP_ID: ${{ vars.ALATTA_HMS_APP_ID }}
        run: python3 scripts/prepare_huawei_config.py

      - name: Report Firebase push setup status
        shell: bash
        env:
          PUSH_APP_ID: ${{ vars.ALATTA_FCM_APP_ID }}
          PUSH_SENDER_ID: ${{ vars.ALATTA_FCM_SENDER_ID }}
          PUSH_PROJECT_ID: ${{ vars.ALATTA_FCM_PROJECT_ID }}
          PUSH_API_KEY: ${{ vars.ALATTA_FCM_API_KEY }}
        run: |
          if [[ -z "$PUSH_APP_ID" || -z "$PUSH_SENDER_ID" || -z "$PUSH_PROJECT_ID" || -z "$PUSH_API_KEY" ]]; then
            echo '::warning::Firebase Android variables are missing. APK will build but background calls and social/message push notifications will remain disabled.'
            echo '⚠️ Background push notifications are disabled until Firebase GitHub Variables + Cloudflare secret are configured.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Firebase Android identifiers supplied (delivery still requires Cloudflare credentials and deployment).'
          fi

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > android-native/local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Restore official signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo '::error::Missing repository secret KEYSTORE_BASE64'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alatta-release.jks"
          chmod 600 "$RUNNER_TEMP/alatta-release.jks"
          echo "ALATTA_KEYSTORE_PATH=$RUNNER_TEMP/alatta-release.jks" >> "$GITHUB_ENV"

      - name: Verify official signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_PASSWORD:-}" || { echo '::error::Missing KEYSTORE_PASSWORD'; exit 1; }
          test -n "${KEY_ALIAS:-}" || { echo '::error::Missing KEY_ALIAS'; exit 1; }
          KEYSTORE_SHA1="$(keytool -list -v -keystore "$ALATTA_KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD \
            | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA1=62E90655FDAF3788706105CF4D998592CBBD8275
          if [[ "$KEYSTORE_SHA1" != "$EXPECTED_SHA1" ]]; then
            echo '::error::Signing certificate SHA-1 differs from the registered Android OAuth fingerprint.'
            exit 1
          fi
          echo 'Release certificate fingerprint verified; private key remains secret.'

      - name: Build signed release APK
        working-directory: android-native
        shell: bash
        env:
          ALATTA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALATTA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ALATTA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Firebase Android configuration is public; keep private service account
          # JSON ONLY in Cloudflare secrets, never in this workflow or APK.
          ALATTA_FCM_APP_ID: ${{ vars.ALATTA_FCM_APP_ID }}
          ALATTA_FCM_SENDER_ID: ${{ vars.ALATTA_FCM_SENDER_ID }}
          ALATTA_FCM_PROJECT_ID: ${{ vars.ALATTA_FCM_PROJECT_ID }}
          ALATTA_FCM_API_KEY: ${{ vars.ALATTA_FCM_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${ALATTA_KEY_PASSWORD:-}" || { echo '::error::Missing KEY_PASSWORD'; exit 1; }
          # Preserve the actual Kotlin compiler diagnostic in a short group,
          # instead of forcing users to copy hundreds of Gradle stack-trace lines.
          set +e
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee "$RUNNER_TEMP/alatta-gradle.log"
          gradle_exit=${PIPESTATUS[0]}
          set -e
          if [[ "$gradle_exit" -ne 0 ]]; then
            echo '::group::Kotlin/compiler errors — copy these lines if the build fails'
            grep -E '(^e: |\.kt:[0-9]+:|(^| )error:|Compilation error|What went wrong)' \
              "$RUNNER_TEMP/alatta-gradle.log" | head -80 || true
            echo '::endgroup::'
            exit "$gradle_exit"
          fi

      - name: Package and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android-native/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          python3 scripts/check_mushaf_apk.py "$APK"
          python3 scripts/check_slim_apk.py "$APK"
          python3 scripts/check_store_apk.py "$APK" --channel direct
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL_SHA1="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-1 digest:[[:space:]]*//p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL_SHA1" = '62E90655FDAF3788706105CF4D998592CBBD8275' || {
            echo '::error::Final APK is not signed with the expected release certificate'
            exit 1
          }
          mkdir -p release-output
          cp "$APK" "release-output/tawasol-alatta-v${RELEASE_VERSION}.apk"
          # The stable filename is for /releases/latest/download/ on the website.
          cp "$APK" release-output/tawasol-alatta-latest.apk
          "$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' | head -n 1 > release-output/signing-certificate-SHA256.txt

      - name: Build and verify the signed AppGallery distribution
        working-directory: android-native
        shell: bash
        env:
          ALATTA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALATTA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ALATTA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALATTA_FCM_APP_ID: ${{ vars.ALATTA_FCM_APP_ID }}
          ALATTA_FCM_SENDER_ID: ${{ vars.ALATTA_FCM_SENDER_ID }}
          ALATTA_FCM_PROJECT_ID: ${{ vars.ALATTA_FCM_PROJECT_ID }}
          ALATTA_FCM_API_KEY: ${{ vars.ALATTA_FCM_API_KEY }}
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain -Palatta.distribution=appgallery assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          python3 ../scripts/check_mushaf_apk.py "$APK"
          python3 ../scripts/check_slim_apk.py "$APK"
          python3 ../scripts/check_store_apk.py "$APK" --channel appgallery
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          ACTUAL_SHA1="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-1 digest:[[:space:]]*//p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL_SHA1" = '62E90655FDAF3788706105CF4D998592CBBD8275'
          cp "$APK" "../release-output/tawasol-alatta-v${RELEASE_VERSION}-appgallery.apk"
          cd ../release-output
          sha256sum "tawasol-alatta-v${RELEASE_VERSION}.apk" tawasol-alatta-latest.apk "tawasol-alatta-v${RELEASE_VERSION}-appgallery.apk" > SHA256SUMS.txt

      - name: Upload official signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Tawasol-Alatta-Official-v${{ env.RELEASE_VERSION }}
          path: release-output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified APK to official GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          APK="release-output/tawasol-alatta-v${RELEASE_VERSION}.apk"
          HUAWEI_APK="release-output/tawasol-alatta-v${RELEASE_VERSION}-appgallery.apk"
          test -s "$APK"
          test -s release-output/tawasol-alatta-latest.apk
          test -s release-output/SHA256SUMS.txt
          test -s "$HUAWEI_APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; not overwriting a published version."
            exit 0
          fi
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::Tag $TAG already exists without a release. Do not overwrite a tagged version."
            exit 1
          fi
          gh release create "$TAG" "$APK" "$HUAWEI_APK" release-output/tawasol-alatta-latest.apk release-output/SHA256SUMS.txt release-output/signing-certificate-SHA256.txt \
            --target "$GITHUB_SHA" \
            --title "تواصل العطا $TAG" \
            --notes "الإصدار الرسمي لتطبيق تواصل العطا Android، موقّع بمفتاح الإصدار الرسمي. يحفظ إمكانية التحديث من داخل التطبيق؛ ويتطلب التثبيت موافقة المستخدم عبر نظام أندرويد. احتفظ بنفس مفتاح التوقيع لكل الإصدارات القادمة."
          echo "Release published: https://github.com/omaratta077-glitch/tawasol-alatta/releases/tag/$TAG"
