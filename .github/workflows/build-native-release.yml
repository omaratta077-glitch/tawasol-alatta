name: Build AL-ATTA Official Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-native/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing Actions secret: $variable"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alatta-release.jks"
          chmod 600 "$RUNNER_TEMP/alatta-release.jks"
          echo "ALATTA_KEYSTORE_PATH=$RUNNER_TEMP/alatta-release.jks" >> "$GITHUB_ENV"
          echo "ALATTA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ALATTA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ALATTA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: android-native
        run: gradle --no-daemon assembleRelease
      - name: Package APK
        run: |
          mkdir -p release-output
          cp android-native/app/build/outputs/apk/release/app-release.apk release-output/tawasol-alatta-v1.0.0.apk
      - name: Upload official APK
        uses: actions/upload-artifact@v4
        with:
          name: Tawasol-Alatta-Official-v1.0.0
          path: release-output/tawasol-alatta-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
