name: Build AL-ATTA Official Release APK

on:
  workflow_dispatch:
  # Build and publish a public APK after pushing a new Android version to main.
  push:
    branches:
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native-release.yml'

permissions:
  contents: write

concurrency:
  group: alatta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify native source and version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE=android-native/app/build.gradle.kts
          MAIN_FILE=android-native/app/src/main/java/com/alatta/nativeapp/MainActivity.kt
          GOOGLE_FILE=android-native/app/src/main/java/com/alatta/nativeapp/GoogleNativeSignIn.kt
          test -f "$BUILD_FILE"
          test -f "$MAIN_FILE"
          test -f "$GOOGLE_FILE"
          RELEASE_VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' "$BUILD_FILE" | head -n 1)"
          RELEASE_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$BUILD_FILE" | head -n 1)"
          test -n "$RELEASE_VERSION" && test -n "$RELEASE_CODE" || {
            echo '::error::Could not extract Android versionName/versionCode'
            exit 1
          }
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "Release version $RELEASE_VERSION (code $RELEASE_CODE)"
          grep -q 'GoogleNativeSignIn.pickAccount' "$MAIN_FILE"
          if grep -Eq 'GoogleWebBridge\.begin|android-google-auth\.html' "$MAIN_FILE"; then
            echo '::error::Old browser-based Google login still present in MainActivity.kt'
            exit 1
          fi
          CHAT_FILE=android-native/app/src/main/java/com/alatta/nativeapp/MessengerChat.kt
          test -s "$CHAT_FILE"
          grep -q 'MessengerInbox(' "$MAIN_FILE"
          grep -q 'MessengerThread(' "$MAIN_FILE"
          grep -q 'api/conversation' "$MAIN_FILE"
          test -s android-native/app/src/main/java/com/alatta/nativeapp/NativeCallScreen.kt
          test -s android-native/app/src/main/java/com/alatta/nativeapp/UserProfileScreen.kt
          test -s android-native/app/src/main/assets/atta-call.html
          grep -q 'getUserMedia' android-native/app/src/main/assets/atta-call.html
          grep -q 'peerPromise' android-native/app/src/main/assets/atta-call.html
          grep -q 'mediaReady' android-native/app/src/main/java/com/alatta/nativeapp/NativeCallScreen.kt
          test -s android-native/app/src/main/java/com/alatta/nativeapp/AttaExpandableVideo.kt
          grep -Eq 'ProfileMediaImage\(image|ExpandableProfileMedia\(image' "$MAIN_FILE"
          grep -q 'AttaExpandableVideo(url)' "$MAIN_FILE"
          grep -q 'call-accept' android-native/app/src/main/assets/atta-call.html
          grep -q 'chatVideoPicker.launch' "$MAIN_FILE"
          grep -q 'PublicUserProfile(' "$MAIN_FILE"
          grep -q 'NativeCallScreen(' "$MAIN_FILE"
          grep -q 'uploadChatMedia' "$MAIN_FILE"
          grep -q 'onVoiceCall' "$MAIN_FILE"
          if grep -q 'اختر صديقًا للمراسلة' "$MAIN_FILE"; then
            echo '::error::Old chat UI detected'
            exit 1
          fi
          PROFILE_FILE=android-native/app/src/main/java/com/alatta/nativeapp/ProfileMedia.kt
          test -s "$PROFILE_FILE"
          grep -q 'profileAvatarPicker.launch' "$MAIN_FILE"
          grep -q 'profileCoverPicker.launch' "$MAIN_FILE"
          grep -q 'encodeProfileImage' "$MAIN_FILE"
          grep -q 'ProfileMediaImage' "$PROFILE_FILE"
          grep -q 'onPickDocument' "$MAIN_FILE"
          grep -q 'onPickAudio' "$MAIN_FILE"
          grep -q 'ModalBottomSheet' "$CHAT_FILE"
          grep -q 'nativeUsernameSignup' "$MAIN_FILE"
          if grep -q 'Text("@\$username"' android-native/app/src/main/java/com/alatta/nativeapp/UserProfileScreen.kt; then
            echo '::error::Username is still shown under public display name'
            exit 1
          fi
          echo 'Native Google sign-in, Messenger, profile media editor, and release version verified.' 

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > android-native/local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Restore official signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo '::error::Missing repository secret KEYSTORE_BASE64'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alatta-release.jks"
          chmod 600 "$RUNNER_TEMP/alatta-release.jks"
          echo "ALATTA_KEYSTORE_PATH=$RUNNER_TEMP/alatta-release.jks" >> "$GITHUB_ENV"

      - name: Verify official signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_PASSWORD:-}" || { echo '::error::Missing KEYSTORE_PASSWORD'; exit 1; }
          test -n "${KEY_ALIAS:-}" || { echo '::error::Missing KEY_ALIAS'; exit 1; }
          KEYSTORE_SHA1="$(keytool -list -v -keystore "$ALATTA_KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD \
            | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA1=62E90655FDAF3788706105CF4D998592CBBD8275
          if [[ "$KEYSTORE_SHA1" != "$EXPECTED_SHA1" ]]; then
            echo '::error::Signing certificate SHA-1 differs from the registered Android OAuth fingerprint.'
            exit 1
          fi
          echo 'Release certificate fingerprint verified; private key remains secret.'

      - name: Build signed release APK
        working-directory: android-native
        shell: bash
        env:
          ALATTA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALATTA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ALATTA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ALATTA_KEY_PASSWORD:-}" || { echo '::error::Missing KEY_PASSWORD'; exit 1; }
          # Preserve the actual Kotlin compiler diagnostic in a short group,
          # instead of forcing users to copy hundreds of Gradle stack-trace lines.
          set +e
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee "$RUNNER_TEMP/alatta-gradle.log"
          gradle_exit=${PIPESTATUS[0]}
          set -e
          if [[ "$gradle_exit" -ne 0 ]]; then
            echo '::group::Kotlin/compiler errors — copy these lines if the build fails'
            grep -E '(^e: |\.kt:[0-9]+:|(^| )error:|Compilation error|What went wrong)' \
              "$RUNNER_TEMP/alatta-gradle.log" | head -80 || true
            echo '::endgroup::'
            exit "$gradle_exit"
          fi

      - name: Package and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android-native/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL_SHA1="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-1 digest:[[:space:]]*//p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL_SHA1" = '62E90655FDAF3788706105CF4D998592CBBD8275' || {
            echo '::error::Final APK is not signed with the expected release certificate'
            exit 1
          }
          mkdir -p release-output
          cp "$APK" "release-output/tawasol-alatta-v${RELEASE_VERSION}.apk"
          # The stable filename is for /releases/latest/download/ on the website.
          cp "$APK" release-output/tawasol-alatta-latest.apk
          (cd release-output && sha256sum "tawasol-alatta-v${RELEASE_VERSION}.apk" tawasol-alatta-latest.apk > SHA256SUMS.txt)

      - name: Upload official signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Tawasol-Alatta-Official-v${{ env.RELEASE_VERSION }}
          path: release-output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified APK to official GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          APK="release-output/tawasol-alatta-v${RELEASE_VERSION}.apk"
          test -s "$APK"
          test -s release-output/tawasol-alatta-latest.apk
          test -s release-output/SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; not overwriting a published version."
            exit 0
          fi
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::Tag $TAG already exists without a release. Do not overwrite a tagged version."
            exit 1
          fi
          gh release create "$TAG" "$APK" release-output/tawasol-alatta-latest.apk release-output/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "تواصل العطا $TAG" \
            --notes "الإصدار الرسمي لتطبيق تواصل العطا Android، موقّع بمفتاح الإصدار الرسمي. يحفظ إمكانية التحديث من داخل التطبيق؛ ويتطلب التثبيت موافقة المستخدم عبر نظام أندرويد. احتفظ بنفس مفتاح التوقيع لكل الإصدارات القادمة."
          echo "Release published: https://github.com/omaratta077-glitch/tawasol-alatta/releases/tag/$TAG"
