name: Gold host debug APK snapshot (no Gold binaries)
on:
  pull_request:
    paths:
      - '.github/workflows/build-gold-host-debug-artifact.yml'
      - 'android-native/app/src/main/java/com/alatta/nativeapp/GoldEngineAppComponentFactory.kt'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  host-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 36
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-native/local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Build Media Gold host only (NO embedded Gold binary)
        working-directory: android-native
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Upload debug base for PRIVATE offline binary-port checks
        uses: actions/upload-artifact@v4
        with:
          name: gold-host-debug-unmodified
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
