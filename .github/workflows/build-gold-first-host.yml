name: Gold-first Media host classes for private Gold-base integration
on:
  pull_request:
    paths:
      - 'android-native/app/src/main/java/com/alatta/nativeapp/GoldFirst*'
      - 'android-native/app/src/test/java/com/alatta/nativeapp/GoldFirst*'
      - '.github/workflows/build-gold-first-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 36
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-native/local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Unit tests and build Media source bridge only
        working-directory: android-native
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug
      - name: Upload UNMODIFIED Media debug host APK for private offline Gold-first patch
        uses: actions/upload-artifact@v4
        with:
          name: gold-first-media-source-debug-host
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          if-no-files-found: error
