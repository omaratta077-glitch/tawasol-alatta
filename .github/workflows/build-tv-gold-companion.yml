name: Build AL-ATTA TV Gold Companion

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-native/tv-shell/**'
      - 'android-native/settings.gradle.kts'
      - 'android-native/app/src/main/java/com/alatta/nativeapp/YtvPlayer.kt'
      - '.github/workflows/build-tv-gold-companion.yml'
  push:
    branches: [main]
    paths:
      - 'android-native/tv-shell/**'
      - 'android-native/settings.gradle.kts'
      - '.github/workflows/build-tv-gold-companion.yml'

permissions:
  contents: write

jobs:
  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android 16 toolchain
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-native/local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Build separately signed gold companion (never repackage YTV)
        working-directory: android-native
        run: gradle --no-daemon --console=plain :tv-shell:assembleDebug
      - name: Verify package, exported launcher and no copied YTV native libraries
        run: |
          set -euo pipefail
          APK=android-native/tv-shell/build/outputs/apk/debug/tv-shell-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.alatta.tv'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "launchable-activity: name='com.alatta.tv.LauncherActivity'"
          test "$(unzip -Z1 "$APK" | grep -Ec '^lib/arm64-v8a/libpk-lib\.so$' || true)" -eq 0
      - name: Upload PR validation APK (debug signer; not stable production key)
        uses: actions/upload-artifact@v4
        with:
          name: AL_ATTA_TV_CHANNELS_v1.1.0
          path: android-native/tv-shell/build/outputs/apk/debug/tv-shell-debug.apk
          if-no-files-found: error
      - name: Restore official signing key for stable channel-catalog release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo '::error::Missing KEYSTORE_BASE64'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/atta-tv-release.jks"
          chmod 600 "$RUNNER_TEMP/atta-tv-release.jks"
          echo "ALATTA_KEYSTORE_PATH=$RUNNER_TEMP/atta-tv-release.jks" >> "$GITHUB_ENV"
      - name: Build officially signed AL-ATTA TV catalog APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: android-native
        env:
          ALATTA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALATTA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ALATTA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain :tv-shell:assembleRelease
          APK=tv-shell/build/outputs/apk/release/tv-shell-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.alatta.tv'"
      - name: Publish AL-ATTA TV channel catalog v1.1.0 on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp android-native/tv-shell/build/outputs/apk/release/tv-shell-release.apk AL_ATTA_TV_CHANNELS_v1.1.0.apk
          TAG="alatta-tv-shell-v1.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AL_ATTA_TV_CHANNELS_v1.1.0.apk --clobber
          else
            gh release create "$TAG" AL_ATTA_TV_CHANNELS_v1.1.0.apk \
              --title "AL-ATTA TV Channel Catalog v1.1.0" \
              --notes "AL-ATTA TV channel catalog that sends channel IDs to AL-ATTA Media v1.0.261 for native Media3 playback. No YTV original code included. Playback depends on authorized source availability."
          fi
