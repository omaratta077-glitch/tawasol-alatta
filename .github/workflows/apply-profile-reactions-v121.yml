name: Apply AL-ATTA Profile and Reactions v1.0.21
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-profile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Apply safe worker changes
        run: python3 scripts/patch_profile_reactions_v121.py
      - name: Verify worker JavaScript syntax
        run: node --check cloudflare-site/src/worker.js
      - name: Commit patch only when necessary
        shell: bash
        run: |
          set -euo pipefail
          git add cloudflare-site/src/worker.js
          if git diff --cached --quiet; then
            echo 'Worker already contains the required changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply profile fields and persistent reaction fixes v1.0.21'
          git push origin HEAD:main
