name: Check Android compile and launcher assets
on:
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/check-native-build.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-native/local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - name: Compile release Kotlin and assemble debug APK
        working-directory: android-native
        run: gradle --no-daemon --console=plain :app:compileReleaseKotlin :app:assembleDebug
