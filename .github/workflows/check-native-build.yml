name: Check Android compile and launcher assets
on:
  pull_request:
    paths:
      - 'android-native/**'
      - 'cloudflare-site/public/privacy.html'
      - 'cloudflare-site/public/terms.html'
      - 'cloudflare-site/public/data-rights.html'
      - 'scripts/check_store_apk.py'
      - '.github/workflows/check-native-build.yml'
permissions:
  contents: read
jobs:
  hadith-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "sdk.dir=$ANDROID_HOME" > android-native/local.properties
      - name: Open the bundled Hadith library on an Arabic Android phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          working-directory: android-native
          script: gradle --no-daemon --console=plain :app:connectedDebugAndroidTest
      - name: Report Android test failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('android-native/app/build/outputs/androidTest-results').rglob('*.xml'):
              root = ET.parse(path).getroot()
              print(path.name, root.attrib)
              for failure in root.iter('failure'):
                  print((failure.text or '')[:10000])
          PY
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-native/local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - name: Test sharing ranges, compile release Kotlin and assemble debug APK
        working-directory: android-native
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:compileReleaseKotlin :app:assembleDebug
      - name: Verify direct distribution APK
        run: python3 scripts/check_store_apk.py android-native/app/build/outputs/apk/debug/app-debug.apk --channel direct
      - name: Compile and test AppGallery distribution
        working-directory: android-native
        run: gradle --no-daemon --console=plain -Palatta.distribution=appgallery :app:testDebugUnitTest :app:compileReleaseKotlin :app:assembleDebug
      - name: Verify AppGallery APK has no external APK installer permission
        run: python3 scripts/check_store_apk.py android-native/app/build/outputs/apk/debug/app-debug.apk --channel appgallery
      - name: Verify both slim release packages using the CI test certificate
        working-directory: android-native
        run: |
          set -euo pipefail
          export ALATTA_KEYSTORE_PATH="$RUNNER_TEMP/alatta-ci-release.jks"
          export ALATTA_KEYSTORE_PASSWORD=android ALATTA_KEY_ALIAS=androiddebugkey ALATTA_KEY_PASSWORD=android
          keytool -genkeypair -keystore "$ALATTA_KEYSTORE_PATH" -storetype JKS \
            -storepass:env ALATTA_KEYSTORE_PASSWORD -keypass:env ALATTA_KEY_PASSWORD \
            -alias "$ALATTA_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=AL-ATTA CI Test Only'
          gradle --no-daemon --console=plain :app:assembleRelease
          python3 ../scripts/check_slim_apk.py app/build/outputs/apk/release/app-release.apk
          python3 ../scripts/check_store_apk.py app/build/outputs/apk/release/app-release.apk --channel direct
          gradle --no-daemon --console=plain -Palatta.distribution=appgallery :app:assembleRelease
          python3 ../scripts/check_slim_apk.py app/build/outputs/apk/release/app-release.apk
          python3 ../scripts/check_store_apk.py app/build/outputs/apk/release/app-release.apk --channel appgallery
