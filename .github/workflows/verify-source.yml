name: Check source integrity (no APK publishing)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official app and backend source
        run: python3 scripts/check_core.py
      - name: Backend and YouTube source tests
        run: |
          node scripts/test_backend.mjs
          node scripts/test_privacy_admin_reset.mjs
          node scripts/test_full_reset.mjs
          node scripts/test_owner_change.mjs
          node scripts/test_admin_management.mjs
          node scripts/test_admin_management_ui.mjs
          node scripts/test_call_signaling_fast.mjs
          node scripts/test_admin_reset_ui.mjs
          node scripts/verify_sources.mjs
          node scripts/test_youtube_single_origin.mjs
          node scripts/test_call_ringing.mjs
          node scripts/test_mobile_call_fallback.mjs
          node scripts/test_call_push.mjs
          node scripts/test_fcm_reserved_key.mjs
          node scripts/test_call_video_stage.mjs
          node scripts/test_quran_reader.mjs
          node scripts/test_call_history.mjs
          node scripts/test_social_push.mjs

  # Compile real Kotlin on PRs before a signed APK is ever published from main.
  # Source-only checks cannot detect unresolved Kotlin references.
  kotlin-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > android-native/local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - name: Compile release Kotlin (no signing, no APK publishing)
        shell: bash
        working-directory: android-native
        run: |
          set -euo pipefail
          gradle :app:compileReleaseKotlin --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/kotlin-compile.log"
