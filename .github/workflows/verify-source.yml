name: Check source integrity (no APK publishing)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official app and backend source
        run: python3 scripts/check_core.py
      - name: Backend and YouTube source tests
        run: |
          node scripts/test_backend.mjs
          node scripts/test_adhan_voices.mjs
          node scripts/test_football_catalog.mjs
          node scripts/test_media_ranges.mjs
          node scripts/test_audit_security.mjs
          node scripts/test_inbox_summary.mjs
          node scripts/test_feed_paging.mjs
          node scripts/test_post_interactions.mjs
          node scripts/test_privacy_admin_reset.mjs
          node scripts/test_full_reset.mjs
          node scripts/test_owner_change.mjs
          node scripts/test_admin_management.mjs
          node scripts/test_admin_management_ui.mjs
          node scripts/test_call_signaling_fast.mjs
          node scripts/test_admin_reset_ui.mjs
          node scripts/verify_sources.mjs
          node scripts/test_youtube_single_origin.mjs
          node scripts/test_call_ringing.mjs
          node scripts/test_mobile_call_fallback.mjs
          node scripts/test_call_push.mjs
          node scripts/test_fcm_reserved_key.mjs
          node scripts/test_call_video_stage.mjs
          node scripts/test_quran_reader.mjs
          node scripts/test_call_history.mjs
          node scripts/test_social_push.mjs
          node scripts/test_appgallery_privacy.mjs
          python3 scripts/test_huawei_config.py
          python3 scripts/test_store_apk.py
          python3 scripts/test_hadith_library.py
