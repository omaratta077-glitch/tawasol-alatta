name: Install AL-ATTA Android Auth API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-auth-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply safe incremental auth patch
        run: python3 scripts/patch_worker_auth.py --path cloudflare-site/src/worker.js

      - name: Validate Worker JavaScript syntax
        run: node --check cloudflare-site/src/worker.js

      - name: Exercise account recovery and Google profile APIs
        run: node scripts/test_auth_backend.mjs cloudflare-site/src/worker.js

      - name: Commit the upgraded Worker (no file replacement)
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cloudflare-site/src/worker.js; then
            echo 'Auth API is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-site/src/worker.js
          git commit -m 'Add Google signup profile and email password recovery API'
          git push origin HEAD:main
