<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تواصل العطا</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="authView" class="auth-view">
  <div class="auth-card">
    <div class="logo">A</div>
    <h1>تواصل العطا</h1>
    <p>مكالمات ومحادثات</p>

    <div class="auth-tabs">
      <button id="loginTab" class="active">دخول</button>
      <button id="registerTab">حساب جديد</button>
    </div>

    <input id="displayNameInput" class="hidden" placeholder="الاسم الظاهر">
    <input id="usernameInput" placeholder="اسم المستخدم">
    <input id="passwordInput" type="password" placeholder="كلمة المرور">
    <button id="authBtn" class="primary">دخول</button>
    <div id="authMsg" class="error"></div>
  </div>
</div>

<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="profile">
      <img id="avatarImg" class="avatar" alt="">
      <div>
        <strong id="meDisplay"></strong>
        <small id="meUsername"></small>
      </div>
      <label class="photo-btn">📷
        <input id="avatarInput" type="file" accept="image/*" hidden>
      </label>
    </div>

    <div class="side-tabs">
      <button class="side-tab active" data-tab="users">المستخدمون</button>
      <button class="side-tab" data-tab="groups">المجموعات</button>
      <button class="side-tab" data-tab="calls">المكالمات</button>
    </div>

    <section id="usersPanel">
      <h4>المتصلون الآن</h4>
      <div id="usersList"></div>
    </section>

    <section id="groupsPanel" class="hidden">
      <button id="newGroupBtn" class="small-btn">+ مجموعة جديدة</button>
      <div id="groupsList"></div>
    </section>

    <section id="callsPanel" class="hidden">
      <div id="callsList"></div>
    </section>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <strong id="selectedLabel">اختر مستخدمًا أو مجموعة</strong>
        <small id="connectionState">متصل</small>
      </div>
      <div>
        <button id="audioCallBtn">📞</button>
        <button id="videoCallBtn">📹</button>
      </div>
    </header>

    <section class="video-area">
      <div class="video-card">
        <video id="remoteVideo" autoplay playsinline></video>
        <span>الطرف الآخر</span>
      </div>
      <div class="video-card local">
        <video id="localVideo" autoplay playsinline muted></video>
        <span>أنت</span>
      </div>
    </section>

    <section class="controls">
      <button id="muteBtn">🎙️ كتم المايك</button>
      <button id="cameraBtn">📷 إيقاف الكاميرا</button>
      <button id="screenBtn">🖥️ مشاركة الشاشة</button>
      <button id="hangupBtn" class="danger">⛔ إنهاء المكالمة</button>
    </section>

    <section class="chat">
      <div id="messages" class="messages"></div>
      <div class="composer">
        <input id="messageInput" placeholder="اكتب رسالة...">
        <button id="sendBtn">إرسال</button>
      </div>
    </section>
  </main>
</div>

<div id="incomingModal" class="modal hidden">
  <div class="modal-card">
    <h3>مكالمة واردة</h3>
    <p id="incomingText"></p>
    <button id="acceptCallBtn" class="primary">قبول</button>
    <button id="rejectCallBtn" class="danger">رفض</button>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
