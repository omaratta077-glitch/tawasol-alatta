<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تواصل العطا</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="authView" class="auth-view">
  <div class="auth-card">
    <div class="logo">A</div>
    <h1>تواصل العطا</h1>
    <p>مكالمات ومحادثات</p>

    <div class="auth-tabs">
      <button id="loginTab" class="active">دخول</button>
      <button id="registerTab">حساب جديد</button>
    </div>

    <div id="registerFields" class="hidden">
      <input id="fullNameInput" placeholder="الاسم الكامل">
      <input id="ageInput" type="number" min="13" max="120" placeholder="العمر">
      <input id="phoneInput" type="tel" placeholder="رقم الهاتف مثال: +9665XXXXXXXX">
      <input id="emailInput" type="email" placeholder="البريد الإلكتروني">
      <select id="genderInput">
        <option value="">الجنس (اختياري)</option>
        <option value="male">ذكر</option>
        <option value="female">أنثى</option>
        <option value="other">أخرى</option>
      </select>
      <input id="countryInput" placeholder="الدولة (اختياري)">
    </div>
    <input id="usernameInput" placeholder="اسم المستخدم">
    <input id="passwordInput" type="password" placeholder="كلمة المرور">
    <input id="confirmPasswordInput" class="hidden" type="password" placeholder="تأكيد كلمة المرور">
    <button id="authBtn" class="primary">دخول</button>
    <div id="authMsg" class="error"></div>
  </div>
</div>


<div id="appView" class="app-shell hidden">
  <header class="mobile-header">
    <div class="brand-mini">تواصل العطا</div>
    <button id="openProfileBtn" class="icon-btn">👤</button>
  </header>

  <main class="social-main">
    <section id="homePage" class="page active-page">
      <div class="stories-section"><div class="stories-head"><strong>الحالات</strong><button id="addStoryBtn">+ إضافة حالة</button></div><div id="storiesStrip" class="stories-strip"></div></div>
      <div class="composer-card">
        <div class="composer-head">
          <img id="homeAvatar" class="avatar" alt="">
          <textarea id="postText" placeholder="بم تفكر؟"></textarea>
        </div>
        <div id="postImagePreviewWrap" class="hidden preview-wrap">
          <img id="postImagePreview" alt="">
        </div>
        <div class="composer-actions">
          <label class="upload-label">🖼️ صورة
            <input id="postImageInput" type="file" accept="image/*" hidden>
          </label>
          <button id="publishPostBtn" class="primary action-btn">نشر</button>
        </div>
      </div>
      <div id="postsFeed"></div>
    </section>

    <section id="searchPage" class="page">
      <div class="page-title"><h2>استكشاف</h2><button id="refreshExploreBtn">تحديث</button></div>
      <div id="exploreFeed" class="explore-grid"></div>
      <h3 class="section-heading">البحث عن مستخدم</h3>
      <div class="search-box">
        <input id="userSearchInput" placeholder="ابحث عن مستخدم...">
        <button id="userSearchBtn">بحث</button>
      </div>
      <div id="searchResults"></div>
    </section>

    <section id="messagesPage" class="page">
      <div class="messages-layout">
        <aside class="chat-sidebar">
          <div class="profile">
            <img id="avatarImg" class="avatar" alt="">
            <div><strong id="meDisplay"></strong><small id="meUsername"></small></div>
            <label class="photo-btn">📷<input id="avatarInput" type="file" accept="image/*" hidden></label>
          </div>

          <div class="side-tabs">
            <button class="side-tab active" data-tab="users">المستخدمون</button>
            <button class="side-tab" data-tab="groups">المجموعات</button>
            <button class="side-tab" data-tab="calls">المكالمات</button>
          </div>

          <section id="usersPanel"><h4>المتصلون الآن</h4><div id="usersList"></div></section>
          <section id="groupsPanel" class="hidden"><button id="newGroupBtn" class="small-btn">+ مجموعة جديدة</button><div id="groupsList"></div></section>
          <section id="callsPanel" class="hidden"><div id="callsList"></div></section>
        </aside>

        <section class="chat-main">
          <header class="topbar">
            <div><strong id="selectedLabel">اختر مستخدمًا أو مجموعة</strong><small id="connectionState">متصل</small></div>
            <div><button id="audioCallBtn">📞</button><button id="videoCallBtn">📹</button></div>
          </header>

          <div id="callStatusBar" class="call-status-bar hidden">
            <span class="call-pulse"></span>
            <span id="callStatusText">مكالمة جارية</span>
            <button id="openCallViewBtn">فتح المكالمة</button>
          </div>

          <section class="chat">
            <div id="messages" class="messages"></div>
            <div id="typingIndicator" class="typing-indicator hidden">يكتب الآن...</div>
            <div class="composer advanced-composer"><label class="chat-attach-btn">📎<input id="chatFileInput" type="file" accept="image/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx" hidden></label><button id="recordVoiceBtn" class="chat-attach-btn" type="button">🎤</button><input id="messageInput" placeholder="اكتب رسالة..."><button id="sendBtn">إرسال</button></div>
          </section>
        </section>
      </div>
    </section>

    <section id="notificationsPage" class="page">
      <div class="page-title"><h2>الإشعارات</h2><button id="markNotificationsRead">تحديد الكل كمقروء</button></div>
      <div id="notificationsList"></div>
    
      <div class="saved-section">
        <div class="page-title">
          <h3>المنشورات المحفوظة</h3>
          <button id="loadSavedBtn">عرض المحفوظات</button>
        </div>
        <div id="savedPostsList"></div>
      </div>
</section>

    <section id="profilePage" class="page">
      <div class="profile-card-large pro-profile-card">
        <div id="profileCover" class="profile-cover"></div>
        <img id="profileAvatarLarge" class="profile-large-avatar pro-avatar" alt="">
        <h2 id="profileName"></h2><div id="profileUsername"></div><p id="profileBio" class="profile-bio"></p>
        <div class="profile-stats"><div><strong id="followersCount">0</strong><span>متابع</span></div><div><strong id="followingCount">0</strong><span>يتابع</span></div></div>
        <div class="profile-edit-grid"><textarea id="bioInput" placeholder="نبذة مختصرة"></textarea><label class="upload-label">🖼️ صورة غلاف<input id="coverInput" type="file" accept="image/*" hidden></label><label><input id="privateAccountInput" type="checkbox"> حساب خاص</label><button id="saveProfileBtn" class="primary action-btn">حفظ</button></div>
        <div id="profileMeta" class="profile-meta"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-page="homePage">🏠<span>الرئيسية</span></button>
    <button class="nav-btn" data-page="searchPage">🧭<span>استكشاف</span></button>
    <button class="nav-btn" data-page="messagesPage">💬<span>الرسائل</span></button>
    <button class="nav-btn" data-page="notificationsPage">🔔<span>الإشعارات</span></button>
    <button class="nav-btn" data-page="profilePage">👤<span>حسابي</span></button>
  </nav>
</div>


<div id="callOverlay" class="call-overlay hidden">
  <div class="call-overlay-header">
    <div class="call-user-info">
      <img id="callPeerAvatar" class="call-peer-avatar" alt="صورة المتصل">
      <div>
        <strong id="callPeerName">مكالمة</strong>
        <small id="callPeerState">جاري الاتصال...</small>
      </div>
    </div>
    <button id="minimizeCallBtn" class="call-top-btn">⌄</button>
  </div>

  <div class="call-stage">
    <video id="remoteVideo" class="remote-full-video" autoplay playsinline></video>

    <div class="remote-empty-state">
      <img id="remoteEmptyAvatar" class="remote-empty-avatar-img" alt="صورة المتصل">
      <div id="remoteEmptyName">الطرف الآخر</div>
    </div>

    <div class="local-pip">
      <video id="localVideo" autoplay playsinline muted></video>
      <span>أنت</span>
    </div>
  </div>

  <div class="call-bottom-sheet">
    <div class="call-tools">
      <button id="muteBtn" class="round-call-btn">
        <span class="round-icon">🎙️</span>
        <small>المايك</small>
      </button>

      <button id="cameraBtn" class="round-call-btn">
        <span class="round-icon">📷</span>
        <small>الكاميرا</small>
      </button>

      <button id="screenBtn" class="round-call-btn">
        <span class="round-icon">🖥️</span>
        <small>الشاشة</small>
      </button>

      <button id="hangupBtn" class="round-call-btn hangup-round">
        <span class="round-icon">📞</span>
        <small>إنهاء</small>
      </button>
    </div>
  </div>
</div>

<div id="storyModal" class="modal hidden"><div class="modal-card"><h3>إضافة حالة</h3><textarea id="storyTextInput" placeholder="اكتب حالة..."></textarea><label class="upload-label">🖼️ صورة<input id="storyMediaInput" type="file" accept="image/*" hidden></label><img id="storyPreview" class="story-preview hidden" alt=""><div class="modal-actions"><button id="publishStoryBtn" class="primary">نشر</button><button id="closeStoryModalBtn">إلغاء</button></div></div></div>
<div id="storyViewer" class="story-viewer hidden"><button id="closeStoryViewer" class="story-close">×</button><div class="story-view-content"><div id="storyViewerAuthor" class="story-view-author"></div><img id="storyViewerImage" class="story-view-image hidden" alt=""><div id="storyViewerText" class="story-view-text"></div></div></div>
<div id="incomingModal" class="modal hidden">
  <div class="modal-card">
    <h3>مكالمة واردة</h3>
    <p id="incomingText"></p>
    <button id="acceptCallBtn" class="primary">قبول</button>
    <button id="rejectCallBtn" class="danger">رفض</button>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>

<audio id="incomingRingAudio" src="audio/incoming-ring.wav" preload="auto" loop></audio>
<audio id="outgoingRingAudio" src="audio/outgoing-ring.wav" preload="auto" loop></audio>

</body>
</html>
