<!doctype html>
<html lang="ar" dir="rtl">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="referrer" content="strict-origin-when-cross-origin">
 <title>مشغّل يوتيوب — العطا</title>
 <style>html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui,Arial,sans-serif}#player{position:absolute;inset:0;width:100%;height:100%}iframe{display:block;border:0;width:100%;height:100%}#err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:#f6d776}</style>
</head>
<body>
 <div id="player"></div>
 <script>
 (()=>{
   'use strict';
   // Same official YouTube nocookie embed and referrer policy as youtube-section.js on the website.
   const id=new URLSearchParams(location.search).get('id')||'';
   if(!/^[A-Za-z0-9_-]{11}$/.test(id)){
     document.querySelector('#player').innerHTML='<p id="err">معرّف الفيديو غير صحيح</p>';return;
   }
   const frame=document.createElement('iframe');
   frame.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?playsinline=1&rel=1';
   frame.title='فيديو YouTube';
   frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
   frame.referrerPolicy='strict-origin-when-cross-origin';
   frame.allowFullscreen=true;
   document.querySelector('#player').append(frame);
 })();
 </script>
</body>
</html>
