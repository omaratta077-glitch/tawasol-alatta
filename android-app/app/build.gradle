plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alatta.tawasol'
    compileSdk 36

    defaultConfig {
        applicationId 'com.alatta.tawasol'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('ANDROID_KEYSTORE_PATH')
            def ksPass = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            def keyAliasEnv = System.getenv('ANDROID_KEY_ALIAS')
            def keyPassEnv = System.getenv('ANDROID_KEY_PASSWORD')
            if (ksPath && ksPass && keyAliasEnv && keyPassEnv) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias keyAliasEnv
                keyPassword keyPassEnv
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
